version: 0.2

env:
  exported-variables:
    - NEED_APPROVAL

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - yum install -y coreutils || true
      - |
        exec > >(stdbuf -oL tee -a /tmp/build.log) 2>&1
        echo "📦 Installing dependencies..."
        yum install -y jq awscli unzip || true
        echo "✅ Install complete"
        exec > >(tee /tmp/build.log) 2>&1
        echo INSTALL_PHASE_STARTED
        pip --version || true
        echo PIPELINE_EXECUTION_ID=$PIPELINE_EXECUTION_ID
        echo STAGE_NAME=$STAGE_NAME

  build:
    commands:

      
      - |
        exec > >(stdbuf -oL tee -a /tmp/build.log) 2>&1
        # Create a helper script with colors using printf
        cat > /tmp/print_color.sh << 'EOF'
        #!/bin/bash
        GREEN='\033[0;32m'
        RED='\033[0;31m'
        YELLOW='\033[1;33m'
        BLUE='\033[0;34m'
        NC='\033[0m'
        
        case "$1" in
          green)   printf "${GREEN}%s${NC}\n" "$2" ;;
          red)     printf "${RED}%s${NC}\n" "$2" ;;
          yellow)  printf "${YELLOW}%s${NC}\n" "$2" ;;
          blue)    printf "${BLUE}%s${NC}\n" "$2" ;;
          *)       printf "%s\n" "$2" ;;
        esac
        EOF
        chmod +x /tmp/print_color.sh

        #  /tmp/print_color.sh green "✅ Env=prod detected. You are deploying *production*, so a manual approval will be required."
        echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [BUILD] 📥 Reading task.json..."
        cp $CODEBUILD_SRC_DIR_ValidatedOutput/task.json task.json
        cat task.json

        echo "📌 Extracting fields..."
        CLIENT=$(jq -r '.client' task.json)
        ENV=$(jq -r '.env' task.json)
        VERSION=$(jq -r '.version' task.json)
        JIRA_ID=$(jq -r '.jira_ticket' task.json)
        echo "🔎 Client=$CLIENT, Env=$ENV, Version=$VERSION, JIRA_ID=$JIRA_ID"

      
        if [ "$ENV" = "prod" ]; then
          export NEED_APPROVAL=true
          /tmp/print_color.sh green "✅ Env=prod detected. You are deploying **production**, so a manual approval will be required."
        else
          export NEED_APPROVAL=false
          /tmp/print_color.sh yellow "ℹ️ Env=${ENV:-unknown}. You are deploying to this environment for client ${CLIENT:-unknown}; **no manual approval** is needed."
        fi

        # -----------------------------
        # 0) Check if deploy array is empty
        # -----------------------------
        DEPLOY_COUNT=$(jq -r '.deploy | length' task.json)
      
        if [[ "$DEPLOY_COUNT" -eq 0 ]]; then
          echo -e "${YELLOW}ℹ️ Deploy array is empty - checking if this is backup-only operation.${NC}"
        else
          echo -e "${GREEN}✅ Deploy array has $DEPLOY_COUNT items.${NC}"
        fi

        # -----------------------------
        # Prepare expected file lists from deploy AND backup
        # -----------------------------
        echo "📋 Extracting all file names from deploy and backup sections..."
      
        # Extract deploy files
        jq -r '.deploy[] | select(.sql_package? != null) | .sql_package' task.json > sql_files.txt || true
        jq -r '.deploy[] | select(.file_name? != null) | .file_name' task.json > file_names.txt || true
        jq -r '.deploy[] | select(.package? != null) | .package' task.json > package_files.txt || true

        # Combine deploy files
        cat sql_files.txt file_names.txt package_files.txt | sed '/^\s*$/d' | sort -u > all_deploy_files.txt || true

        echo "📄 Files mentioned in deploy section:"
        cat all_deploy_files.txt || true
        DEPLOY_FILE_COUNT=$(cat all_deploy_files.txt | wc -l)
        echo "🔢 Deploy files to validate: $DEPLOY_FILE_COUNT"

        # Debug: Show all top-level keys in JSON
        echo ""
        echo "🔍 DEBUG: All top-level keys in task.json:"
        jq -r 'keys[]' task.json 2>/dev/null || echo "Failed to read keys"
        
        # Extract backup files - Method 1: Direct approach for all keys
        echo ""
        echo "🔍 Extracting ConfigurationTransfer template_file values..."
        jq -r '
          . as $root | 
          keys[] | 
          select(startswith("ConfigurationTransfer")) | 
          . as $key | 
          $root[$key] | 
          select(.template_file != null) | 
          .template_file
        ' task.json 2>&1 | tee config_backup_files.txt
        
        echo ""
        echo "🔍 Extracting TLMView blueprint_file values..."
        jq -r '
          . as $root | 
          keys[] | 
          select(startswith("TLMView")) | 
          . as $key | 
          $root[$key] | 
          select(.blueprint_file != null) | 
          .blueprint_file
        ' task.json 2>&1 | tee tlm_backup_files.txt

        # Alternative: Use grep and manual parsing if jq fails
        if [[ ! -s config_backup_files.txt ]] && [[ ! -s tlm_backup_files.txt ]]; then
          echo ""
          echo "⚠️ jq extraction failed, trying alternative method..."
          
          # Extract ConfigurationTransfer template_file using grep/sed
          grep -A 10 '"ConfigurationTransfer' task.json | grep '"template_file"' | sed 's/.*"template_file"[^"]*"\([^"]*\)".*/\1/' > config_backup_files.txt || true
          
          # Extract TLMView blueprint_file using grep/sed
          grep -A 10 '"TLMView' task.json | grep '"blueprint_file"' | sed 's/.*"blueprint_file"[^"]*"\([^"]*\)".*/\1/' > tlm_backup_files.txt || true
        fi

        # Combine and deduplicate backup files
        cat config_backup_files.txt tlm_backup_files.txt 2>/dev/null | sed '/^\s*$/d' | sort -u > all_backup_files.txt || true

        echo ""
        echo "📦 Backup files found:"
        echo "--------------------"
        if [[ -s all_backup_files.txt ]]; then
          cat all_backup_files.txt | nl
        else
          echo "(none)"
        fi
        
        BACKUP_FILE_COUNT=$(cat all_backup_files.txt | wc -l)
        echo ""
        echo "🔢 Backup files to validate: $BACKUP_FILE_COUNT"

        # Debug: Show what's in the temp files
        echo ""
        echo "🔍 DEBUG: Contents of config_backup_files.txt:"
        cat config_backup_files.txt 2>/dev/null || echo "(empty or missing)"
        echo ""
        echo "🔍 DEBUG: Contents of tlm_backup_files.txt:"
        cat tlm_backup_files.txt 2>/dev/null || echo "(empty or missing)"

        # Calculate total files to validate
        TOTAL_FILE_COUNT=$((DEPLOY_FILE_COUNT + BACKUP_FILE_COUNT))
        
        echo ""
        echo "=========================================="
        echo "📊 VALIDATION SUMMARY"
        echo "=========================================="
        echo "Deploy files: $DEPLOY_FILE_COUNT"
        echo "Backup files: $BACKUP_FILE_COUNT"
        echo "Total files to validate: $TOTAL_FILE_COUNT"
        echo "=========================================="

        if [[ "$TOTAL_FILE_COUNT" -eq 0 ]]; then
          echo "${YELLOW}ℹ️ No files to validate in deploy or backup sections. Skipping ZIP validation.${NC}"
          exit 0
        fi

        # -----------------------------
        # 1) Check release ZIP exists
        # -----------------------------
        echo "🔍 Checking for release package..."
      
        ZIP_KEY="release-management/client-packages/${JIRA_ID}.zip"
        ZIP_BUCKET="smartstream-environment-file-transfer-bucket"
        ZIP_S3="s3://${ZIP_BUCKET}/${ZIP_KEY}"

        if aws s3api head-object --bucket "$ZIP_BUCKET" --key "$ZIP_KEY" > /dev/null 2>&1; then
          echo -e "${GREEN}✅ Found release ZIP: $ZIP_S3${NC}"
        else
          echo -e "${RED}❌ Missing release ZIP: $ZIP_S3${NC}"
          echo -e "ℹ️ Required because task.json has files in deploy or backup sections"
          exit 1
        fi

        # -----------------------------
        # 2) Fetch ZIP file listing (stream first, fallback to ranged read)
        # -----------------------------
      
        echo "🔍 Attempting to read ZIP contents by streaming (no full download)..."

        get_zip_listing() {
          local s3path="$1"
          
          # Try streaming unzip -l from stdin
          UNZIP_OUTPUT=$(aws s3 cp "$s3path" - 2>/dev/null | unzip -l - 2>/dev/null || echo "")
          
          if [[ -n "$UNZIP_OUTPUT" ]]; then
            # Parse file listing
            ZIP_FILE_LIST=$(echo "$UNZIP_OUTPUT" | awk '
              BEGIN { in_list=0 }
              /^---------/ { 
                if (in_list == 0) { in_list=1; next }
                else { in_list=0; next }
              }
              in_list==1 && NF>=4 { 
                fname=""
                for(i=4; i<=NF; i++) {
                  fname = fname (i==4 ? "" : " ") $i
                }
                print fname
              }
            ')
            
            # Extract expected file count from footer
            EXPECTED_COUNT=$(echo "$UNZIP_OUTPUT" | grep -E '[0-9]+\s+files?' | tail -1 | awk '{for(i=1;i<=NF;i++) if($i~/^[0-9]+$/ && $(i+1)~/files?/) print $i}')
            
            # Count actual files parsed
            ACTUAL_COUNT=$(echo "$ZIP_FILE_LIST" | grep -v '^$' | wc -l)
            
            echo "ℹ️ Expected files: $EXPECTED_COUNT, Actual parsed: $ACTUAL_COUNT"
            
            if [[ "$EXPECTED_COUNT" == "$ACTUAL_COUNT" ]]; then
              echo "✅ All files successfully parsed from ZIP listing"
              echo "$ZIP_FILE_LIST"
              return 0
            else
              echo "⚠️ File count mismatch! Expected $EXPECTED_COUNT but parsed $ACTUAL_COUNT"
            fi
          fi

          # Fallback: ranged read
          echo "⚠️ Streaming failed or incomplete. Falling back to ranged read of ZIP central directory."

          HEAD_JSON=$(aws s3api head-object --bucket "$ZIP_BUCKET" --key "$ZIP_KEY" --query '{Size:ContentLength}' --output json)
          SIZE=$(echo "$HEAD_JSON" | jq -r '.Size' 2>/dev/null || echo "")

          if [[ -z "$SIZE" || "$SIZE" == "null" ]]; then
            echo "❌ Unable to determine ZIP size via head-object."
            return 1
          fi

          READ_BYTES=262144
          if [[ $SIZE -le $READ_BYTES ]]; then
            START=0
          else
            START=$((SIZE - READ_BYTES))
          fi
          END=$((SIZE - 1))

          echo "ℹ️ ZIP size: $SIZE bytes. Attempting range bytes=${START}-${END}"
          aws s3api get-object --bucket "$ZIP_BUCKET" --key "$ZIP_KEY" --range "bytes=${START}-${END}" partial.zip > /dev/null 2>&1
          
          if [[ ! -f partial.zip ]]; then
            echo "❌ Failed to fetch partial.zip via ranged get-object."
            return 1
          fi

          UNZIP_OUTPUT=$(unzip -l partial.zip 2>/dev/null || echo "")
          
          if [[ -n "$UNZIP_OUTPUT" ]]; then
            ZIP_FILE_LIST=$(echo "$UNZIP_OUTPUT" | awk '
              BEGIN { in_list=0 }
              /^---------/ { 
                if (in_list == 0) { in_list=1; next }
                else { in_list=0; next }
              }
              in_list==1 && NF>=4 { 
                fname=""
                for(i=4; i<=NF; i++) {
                  fname = fname (i==4 ? "" : " ") $i
                }
                print fname
              }
            ')
            
            EXPECTED_COUNT=$(echo "$UNZIP_OUTPUT" | grep -E '[0-9]+\s+files?' | tail -1 | awk '{for(i=1;i<=NF;i++) if($i~/^[0-9]+$/ && $(i+1)~/files?/) print $i}')
            ACTUAL_COUNT=$(echo "$ZIP_FILE_LIST" | grep -v '^$' | wc -l)
            
            echo "ℹ️ Expected files: $EXPECTED_COUNT, Actual parsed: $ACTUAL_COUNT"
            
            if [[ "$EXPECTED_COUNT" == "$ACTUAL_COUNT" ]]; then
              echo "✅ All files successfully parsed from partial ZIP"
              rm -f partial.zip || true
              echo "$ZIP_FILE_LIST"
              return 0
            fi
          fi
          
          # Combined head+tail fallback
          aws s3api get-object --bucket "$ZIP_BUCKET" --key "$ZIP_KEY" --range "bytes=0-65535" head_part.bin > /dev/null 2>&1 || true
          
          if [[ -f head_part.bin ]]; then
            cat head_part.bin partial.zip > combined_partial.zip 2>/dev/null || true
            
            if [[ -f combined_partial.zip ]]; then
              UNZIP_OUTPUT=$(unzip -l combined_partial.zip 2>/dev/null || echo "")
              
              if [[ -n "$UNZIP_OUTPUT" ]]; then
                ZIP_FILE_LIST=$(echo "$UNZIP_OUTPUT" | awk '
                  BEGIN { in_list=0 }
                  /^---------/ { 
                    if (in_list == 0) { in_list=1; next }
                    else { in_list=0; next }
                  }
                  in_list==1 && NF>=4 { 
                    fname=""
                    for(i=4; i<=NF; i++) {
                      fname = fname (i==4 ? "" : " ") $i
                    }
                    print fname
                  }
                ')
                
                EXPECTED_COUNT=$(echo "$UNZIP_OUTPUT" | grep -E '[0-9]+\s+files?' | tail -1 | awk '{for(i=1;i<=NF;i++) if($i~/^[0-9]+$/ && $(i+1)~/files?/) print $i}')
                ACTUAL_COUNT=$(echo "$ZIP_FILE_LIST" | grep -v '^$' | wc -l)
                
                if [[ "$EXPECTED_COUNT" == "$ACTUAL_COUNT" ]]; then
                  echo "✅ All files successfully parsed from combined partial ZIP"
                  rm -f head_part.bin partial.zip combined_partial.zip || true
                  echo "$ZIP_FILE_LIST"
                  return 0
                fi
              fi
            fi
            
            rm -f head_part.bin combined_partial.zip || true
          fi

          rm -f partial.zip || true

          if [[ -n "$ZIP_FILE_LIST" ]]; then
            echo "⚠️ WARNING: File count validation failed but returning partial list"
            echo "$ZIP_FILE_LIST"
            return 0
          else
            echo "❌ Unable to obtain ZIP file list by any method."
            return 1
          fi
        }

        ZIP_LISTING=$(get_zip_listing "$ZIP_S3") || {
          echo "❌ Failed to read ZIP contents from $ZIP_S3"
          exit 1
        }

        FINAL_FILE_COUNT=$(echo "$ZIP_LISTING" | grep -v '^$' | wc -l)
        
        echo ""
        echo "=========================================="
        echo "📊 ZIP CONTENTS SUMMARY"
        echo "=========================================="
        echo "Total files in ZIP: $FINAL_FILE_COUNT"
        echo ""
        echo "First 10 files:"
        echo "$ZIP_LISTING" | head -n 10
        echo ""
        echo "Last 10 files:"
        echo "$ZIP_LISTING" | tail -n 10
        echo "=========================================="

        # -----------------------------
        # 3) Validate DEPLOY files in ZIP (under /deploy folder)
        # -----------------------------
      
        if [[ ! -s all_deploy_files.txt ]]; then
          echo "ℹ️ No deploy files to validate."
        else
          echo ""
          echo "=========================================="
          echo "🔎 VALIDATING DEPLOY FILES"
          echo "=========================================="

          MISSING=0
          while IFS= read -r EXPECTED; do
            [[ -z "${EXPECTED// }" ]] && continue

            echo " - Checking deploy file: $EXPECTED"
            
            # Check if file exists in ZIP under /deploy/ folder (case-insensitive)
            if echo "$ZIP_LISTING" | awk '{print tolower($0)}' | grep -i "/deploy/" | grep -F -i -q "$(echo "$EXPECTED" | tr '[:upper:]' '[:lower:]')" ; then
              echo "   ✅ Found in /deploy/: $EXPECTED"
            elif echo "$ZIP_LISTING" | awk -F/ '{print tolower($NF)}' | grep -F -i -q "$(echo "$EXPECTED" | tr '[:upper:]' '[:lower:]')" ; then
              # Fallback: filename match anywhere
              MATCHED_PATH=$(echo "$ZIP_LISTING" | grep -i "/deploy/" | grep -i "$EXPECTED" | head -1)
              if [[ -n "$MATCHED_PATH" ]]; then
                echo "   ✅ Found in deploy folder: $MATCHED_PATH"
              else
                echo "   ❌ MISSING in /deploy/ folder: $EXPECTED"
                MISSING=1
              fi
            else
              echo "   ❌ MISSING in ZIP: $EXPECTED"
              MISSING=1
            fi
          done < all_deploy_files.txt

          if [[ "$MISSING" -eq 1 ]]; then
            echo -e "${YEREDLOW}❌ Deploy validation failed: One or more deploy files are missing from ZIP.${NC}"
            exit 1
          else
            echo -e "${GREEN}✅ All deploy files validated successfully.${NC}"
          fi
        fi

        # -----------------------------
        # 4) Validate BACKUP files in ZIP (under /backup folder)
        # -----------------------------
      
        if [[ ! -s all_backup_files.txt ]]; then
          echo "ℹ️ No backup files to validate."
        else
          echo ""
          echo "=========================================="
          echo "🔎 VALIDATING BACKUP FILES"
          echo "=========================================="

          MISSING=0
          while IFS= read -r EXPECTED; do
            [[ -z "${EXPECTED// }" ]] && continue

            echo " - Checking backup file: $EXPECTED"
            
            # Check if file exists in ZIP under /backup/ folder (case-insensitive)
            if echo "$ZIP_LISTING" | awk '{print tolower($0)}' | grep -i "/backup/" | grep -F -i -q "$(echo "$EXPECTED" | tr '[:upper:]' '[:lower:]')" ; then
              echo "   ✅ Found in /backup/: $EXPECTED"
            elif echo "$ZIP_LISTING" | awk -F/ '{print tolower($NF)}' | grep -F -i -q "$(echo "$EXPECTED" | tr '[:upper:]' '[:lower:]')" ; then
              # Fallback: filename match in backup folder
              MATCHED_PATH=$(echo "$ZIP_LISTING" | grep -i "/backup/" | grep -i "$EXPECTED" | head -1)
              if [[ -n "$MATCHED_PATH" ]]; then
                echo "   ✅ Found in backup folder: $MATCHED_PATH"
              else
                echo "   ❌ MISSING in /backup/ folder: $EXPECTED"
                MISSING=1
              fi
            else
              echo "   ❌ MISSING in ZIP: $EXPECTED"
              MISSING=1
            fi
          done < all_backup_files.txt

          if [[ "$MISSING" -eq 1 ]]; then
            echo -e "${RED}❌ Backup validation failed: One or more backup files are missing from ZIP.${NC}"
            exit 1
          else
            echo -e "${GREEN}✅ All backup files validated successfully.${NC}"
          fi
        fi

        # -----------------------------
        # Final Summary
        # -----------------------------
      
        echo ""
        echo "=========================================="
        echo -e "${GREEN}✅ VALIDATION COMPLETE${NC}"
        echo "=========================================="
        echo -e "${BLUE}Deploy files validated: $DEPLOY_FILE_COUNT${NC}"
        echo -e "${BLUE}Backup files validated: $BACKUP_FILE_COUNT${NC}"
        echo -e "${BLUE}Total files validated: $TOTAL_FILE_COUNT${NC}"
        echo "=========================================="
      
        # -----------------------------
        # 3) Checking server name and instance id
        # -----------------------------

        echo "📥 Fetching Parameter Store JSON..."
        PARAM_PATH="/arm-cpr/${CLIENT}/${ENV}/details.json"
        PARAM_JSON=$(aws ssm get-parameter --name "$PARAM_PATH" --with-decryption --query 'Parameter.Value' --output text)
        echo "$PARAM_JSON" | jq .

        echo "🔍 Extracting unique servers from task.json..."
     
        SERVERS=$(jq -r '
          [
            (.backup[]? | select(.server_name != null) | .server_name),
            (.backup[]? | select(.server != null) | .server),
            (.deploy[]? | select(.server_name != null) | .server_name),
            (.deploy[]? | select(.server != null) | .server)
          ] | unique | .[]
        ' task.json)
        
        echo "📋 Servers found in task.json:"
        echo "$SERVERS"
        
        if [ -z "$SERVERS" ]; then
          echo "⚠️  No servers found in task.json"
        fi

        echo "✅ Validating servers in Parameter Store..."
     
        VALIDATION_FAILED=false
        MISSING_SERVERS=""
        
        for SERVER in $SERVERS; do
          echo "🔎 Checking server: $SERVER"
          
          # Construct the instance_id key based on server name (case-sensitive)
          INSTANCE_KEY="${SERVER}_instance_id"
          
          # Check if the key exists in Instance_mapping
          INSTANCE_ID=$(echo "$PARAM_JSON" | jq -r --arg key "$INSTANCE_KEY" '.Instance_mappings[$key] // empty')
          
          if [ -z "$INSTANCE_ID" ]; then
            echo -e "${RED}❌ FAILED: Server '$SERVER' not found in Parameter Store${NC}"
            echo "  Expected key: Instance_mapping.$INSTANCE_KEY"
            VALIDATION_FAILED=true
            MISSING_SERVERS="${MISSING_SERVERS}\n  - ${SERVER} (key: ${INSTANCE_KEY})"
          else
            echo -e "${GREEN}✅ Server '$SERVER' found with instance_id: $INSTANCE_ID${NC}"
          fi
        done
        
        if [ "$VALIDATION_FAILED" = true ]; then
          echo ""
          echo "=========================================="
          echo "❌ SERVER VALIDATION FAILED"
          echo "=========================================="
          echo "The following servers are missing in Parameter Store:"
          echo -e "$MISSING_SERVERS"
          echo ""
          echo "Please ensure these keys exist in:"
          echo "Parameter Store Path: $PARAM_PATH"
          echo "Under: Instance_mapping.<server_name>_instance_id"
          echo "=========================================="
          exit 1
        fi
        
        echo ""
        echo -e "${GREEN}✅ All servers validated successfully!${NC}"
        echo "=========================================="

        # -----------------------------
        # 4) Presence flags for other validations
        # -----------------------------
        DB_SQL_PRESENT=$(jq -r '[.deploy[] | select(.task_type=="DatabaseSql")] | length' task.json)
        WAR_COUNT=$(jq -r '[.deploy[] | select(.task_type | test("^WarDeployment"))] | length' task.json)
        LINUX_COUNT=$(jq -r '[.deploy[] | select(.task_type=="LinuxPackages")] | length' task.json)
        CONTROL_COUNT=$(jq -r '[.deploy[] | select(.task_type | test("^Control"))] | length' task.json)
        CT_COUNT=$(jq -r '[.deploy[] | select(.task_type | test("^ConfigurationTransfer"))] | length' task.json)
        TLMVIEW_COUNT=$(jq -r '[.deploy[] | select(.task_type | test("^TLMView"))] | length' task.json)
        STATIC_COUNT=$(jq -r '[.deploy[] | select(.task_type | test("^Static"))] | length' task.json)
      
        echo "ℹ️ Task type summary: DB=$DB_SQL_PRESENT WAR=$WAR_COUNT LINUX=$LINUX_COUNT CONTROL=$CONTROL_COUNT CT=$CT_COUNT TLMVIEW=$TLMVIEW_COUNT STATIC=$STATIC_COUNT"

        # -----------------------------
        # 5) Continue with your existing validations...
        # (Parameter Store, SQL checks, WAR checks, CONTROL, CT, TLMView, Static)
        # The rest of your script logic is preserved unchanged below.
        # -----------------------------
        echo "📥 Fetching Parameter Store JSON..."
        PARAM_PATH="/arm-cpr/${CLIENT}/${ENV}/details.json"
        PARAM_JSON=$(aws ssm get-parameter --name "$PARAM_PATH" --with-decryption --query 'Parameter.Value' --output text)
        echo "$PARAM_JSON" | jq .

        echo "🧪 Validating mandatory top-level keys in Parameter Store JSON..."

        for key in region assume_role_arn Instance_mappings; do
          VALUE=$(echo "$PARAM_JSON" | jq -r --arg k "$key" '.[$k]');
          if [[ "$VALUE" == "null" || -z "$VALUE" ]]; then
            echo "❌ Missing top-level key: $key";
            exit 1;
          else
            echo "✅ Found top-level key: $key";
          fi;
        done

        # SQL validations (only if present)

        if [[ "$DB_SQL_PRESENT" -ge 1 ]]; then
          echo "✅ DatabaseSql task found. Validating SQL scripts and parameters..."

          S3_BASE="s3://smartstream-environment-file-transfer-bucket/release-management/common-scripts"
          REQUIRED_SQL_SCRIPTS=("backup-sqltable.sh" "backup-sqlprocedure.sh" "backup-sqlview.sh" "backup-sqlfunction.sh" "deploy-sqltask.sh" "rollback-sqltable.sh")
          for F in "${REQUIRED_SQL_SCRIPTS[@]}"; do
            P="${S3_BASE}/${F}"
            echo "🔍 Checking ${P}"
            if aws s3 ls "$P" > /dev/null 2>&1; then
              echo "✅ Found ${F}"
            else
              echo "❌ Missing SQL script: ${P}"
              exit 1
            fi
          done

          SQLSERVER_ID=$(echo "$PARAM_JSON" | jq -r '.task_type_mappings.sqlserver_instance_id')
          if [[ "$SQLSERVER_ID" == "null" || -z "$SQLSERVER_ID" ]]; then
            echo "❌ Missing task_type_mappings.sqlserver_instance_id"
            exit 1
          else
            echo "✅ Found sqlserver_instance_id: $SQLSERVER_ID"
          fi

          echo "🧪 Validating database_details keys..."
          for key in oracle_host oracle_sid oracle_port oracle_user secret_arn; do
            VAL=$(echo "$PARAM_JSON" | jq -r --arg k "$key" '.database_details[$k]')
            if [[ "$VAL" == "null" || -z "$VAL" ]]; then
              echo "❌ Missing database_details.$key"
              exit 1
            else
              echo "✅ database_details.$key = $VAL"
            fi
          done
        else
          echo "ℹ️ No DatabaseSql task in deploy. Skipping SQL checks."
        fi

        # WAR validations

        if [[ "$WAR_COUNT" -ge 1 ]]; then
          echo "✅ WAR tasks found (${WAR_COUNT}). Validating WAR scripts and instance mappings..."
          S3_BASE="s3://smartstream-environment-file-transfer-bucket/release-management/common-scripts"
          WAR_SCRIPT="${S3_BASE}/backup-war.sh"
          echo "🔍 Checking ${WAR_SCRIPT}"
          if aws s3 ls "$WAR_SCRIPT" > /dev/null 2>&1; then
            echo "✅ Found backup-war.sh"
          else
            echo "❌ Missing backup-war.sh at ${WAR_SCRIPT}"
            exit 1
          fi

          MISSING=""
          while IFS= read -r COMP; do
            if [[ -z "$COMP" || "$COMP" == "null" ]]; then
              echo "❌ WarDeployment item missing server_name"
              MISSING="yes"
              continue
            fi
            MAP_KEY="${COMP}_instance_id"
            IID=$(echo "$PARAM_JSON" | jq -r --arg k "$MAP_KEY" '.Instance_mappings[$k]')
            if [[ "$IID" == "null" || -z "$IID" ]]; then
              echo "❌ Missing Instance_mappings.${MAP_KEY}"
              MISSING="yes"
            else
              echo "✅ Mapping found: Instance_mappings.${MAP_KEY} = ${IID}"
            fi
          done < <(jq -r '.deploy[] | select(.task_type | test("^WarDeployment")) | ( .server // .server_name // "" ) | ascii_downcase' task.json | sort -u)

          if [[ "$MISSING" == "yes" ]]; then
            echo "❌ WAR validation failed due to missing server_name/mappings."
            exit 1
          fi
        else
          echo "ℹ️ No WarDeployment* tasks in deploy. Skipping WAR checks."
        fi

        # LinuxPackages validations

        if [[ "$LINUX_COUNT" -ge 1 ]]; then
          echo "✅ LinuxPackages tasks found (${LINUX_COUNT}). Ensure LinuxPackages scripts exist..."
          S3_COMMON="s3://smartstream-environment-file-transfer-bucket/release-management/common-scripts"
          LINUX_SCRIPT="${S3_COMMON}/backup-linux.sh"
          echo "🔍 Checking ${LINUX_SCRIPT}"
          if aws s3 ls "$LINUX_SCRIPT" > /dev/null 2>&1; then
            echo "✅ Found backup-linux.sh"
          else
            echo "❌ Missing backup-linux.sh at ${LINUX_SCRIPT}"
            exit 1
          fi
        else
          echo "ℹ️ No LinuxPackages tasks in deploy. Skipping Linux checks."
        fi

        # Control validations

        if [[ "$CONTROL_COUNT" -ge 1 ]]; then
          echo "✅ Control tasks found (${CONTROL_COUNT}). Validating utilities and Parameter Store control_details..."
          UTIL_PREFIX="s3://smartstream-environment-file-transfer-bucket/release-management/utilities/${VERSION}/"
          if aws s3 ls "${UTIL_PREFIX}" | awk '{print $4}' | grep -E '^tool.*\.zip$' > /dev/null 2>&1; then
            echo "✅ Found at least one tool*.zip in ${UTIL_PREFIX}"
          else
            echo "❌ Missing tool*.zip under ${UTIL_PREFIX}"
            exit 1
          fi

          echo "🔍 Validating Parameter Store 'control_details' keys..."
          for key in wc_user wc_password control_server_ip control_server_port; do
            VAL=$(echo "$PARAM_JSON" | jq -r --arg k "$key" '.control_details[$k]')
            if [[ "$VAL" == "null" || -z "$VAL" ]]; then
              echo "❌ Missing control_details.$key in Parameter Store ($PARAM_PATH)"
              exit 1
            else
              echo "✅ control_details.$key = $VAL"
            fi
          done

          CONTROL_SCRIPTS_BASE="s3://smartstream-environment-file-transfer-bucket/release-management/common-scripts"
          declare -a CONTROL_SCRIPTS=("backup-get-project-id.sh" "backup-modularexport.sh")
          echo "🔍 Checking control backup scripts under ${CONTROL_SCRIPTS_BASE}"
          for script in "${CONTROL_SCRIPTS[@]}"; do
            SCRIPT_PATH="${CONTROL_SCRIPTS_BASE}/${script}"
            echo " - Checking ${SCRIPT_PATH}"
            if aws s3 ls "${SCRIPT_PATH}" > /dev/null 2>&1; then
              echo "   ✅ Found ${script}"
            else
              echo "   ❌ Missing ${script} at ${SCRIPT_PATH}"
              exit 1
            fi
          done
        else
          echo "ℹ️ No Control tasks in deploy. Skipping Control validations."
        fi

        # CT validations

        if [[ "$CT_COUNT" -ge 1 ]]; then
          echo "✅ ConfigurationTransfer tasks found (${CT_COUNT}). Validating CT utilities and common scripts..."
          UTIL_PREFIX="s3://smartstream-environment-file-transfer-bucket/release-management/utilities/${VERSION}/"
          if [[ "$VERSION" == "RP-3.0" | "$VERSION" == "RP-3.1" ]]; then
            CT_UTIL="${UTIL_PREFIX}CT.zip"
          elif [[ "$VERSION" == "RP-3.3.0" ]]; then
            CT_UTIL="${UTIL_PREFIX}CT.tar.gz"
          else
            echo "❌ Unsupported version $VERSION. Skipping CT validation."
            exit 1
          fi

          if aws s3 ls "${CT_UTIL}" > /dev/null 2>&1; then
            echo "✅ Found CT utility: ${CT_UTIL}"
          else
            echo "❌ Missing CT utility: ${CT_UTIL}"
            exit 1
          fi

          S3_COMMON="s3://smartstream-environment-file-transfer-bucket/release-management/common-scripts"
          REQUIRED_CT_SCRIPTS=("backup-ct.sh" "deploy-ct.sh" "rollback-ct.sh")
          echo "🔍 Checking CT scripts in ${S3_COMMON}"
          for s in "${REQUIRED_CT_SCRIPTS[@]}"; do
            P="${S3_COMMON}/${s}"
            echo " - Checking ${P}"
            if aws s3 ls "${P}" > /dev/null 2>&1; then
              echo "   ✅ Found ${s}"
            else
              echo "   ❌ Missing CT script: ${P}"
              exit 1
            fi
          done
        else
          echo "ℹ️ No ConfigurationTransfer tasks in deploy. Skipping CT validations."
        fi

        # TLMView validations

        if [[ "$TLMVIEW_COUNT" -ge 1 ]]; then
          echo "✅ TLMView tasks found (${TLMVIEW_COUNT}). Validating TLMView utilities and common scripts..."
          UTIL_PREFIX="s3://smartstream-environment-file-transfer-bucket/release-management/utilities/${VERSION}/"
          TLM_UTIL="${UTIL_PREFIX}config-manager.jar"
          echo "🔍 Checking for TLMView utility: ${TLM_UTIL}"
          if aws s3 ls "${TLM_UTIL}" > /dev/null 2>&1; then
            echo "✅ Found TLMView utility: config-manager.jar"
          else
            echo "❌ Missing TLMView utility: ${TLM_UTIL}"
            exit 1
          fi

          S3_COMMON="s3://smartstream-environment-file-transfer-bucket/release-management/common-scripts"
          REQUIRED_TLM_SCRIPTS=("backup-tlmview.sh" "deploy-tlmview.sh" "rollback-tlmview.sh")
          echo "🔍 Checking TLMView scripts in ${S3_COMMON}"
          for s in "${REQUIRED_TLM_SCRIPTS[@]}"; do
            P="${S3_COMMON}/${s}"
            echo " - Checking ${P}"
            if aws s3 ls "${P}" > /dev/null 2>&1; then
              echo "   ✅ Found ${s}"
            else
              echo "   ❌ Missing TLMView script: ${P}"
              exit 1
            fi
          done
        else
          echo "ℹ️ No TLMView tasks in deploy. Skipping TLMView validations."
        fi

        # Static validations
      
        if [[ "$STATIC_COUNT" -ge 1 ]]; then
          echo "✅ Static tasks found (${STATIC_COUNT}). Validating Static common scripts..."
          S3_COMMON="s3://smartstream-environment-file-transfer-bucket/release-management/common-scripts"
          REQUIRED_STATIC_SCRIPTS=("backup-static.sh" "deploy-static.sh")
          echo "🔍 Checking Static scripts in ${S3_COMMON}"
          for s in "${REQUIRED_STATIC_SCRIPTS[@]}"; do
            P="${S3_COMMON}/${s}"
            echo " - Checking ${P}"
            if aws s3 ls "${P}" > /dev/null 2>&1; then
              echo "   ✅ Found ${s}"
            else
              echo "   ❌ Missing Static script: ${P}"
              exit 1
            fi
          done
        else
          echo "ℹ️ No Static tasks in deploy. Skipping Static validations."
        fi

        echo "✅ All validations complete."

        echo "📌 Final summary:"
        echo "   DB_SQL_PRESENT: $DB_SQL_PRESENT"
        echo "   WAR_COUNT: $WAR_COUNT"
        echo "   LINUX_COUNT: $LINUX_COUNT"
        echo "   CONTROL_COUNT: $CONTROL_COUNT"
        echo "   CT_COUNT: $CT_COUNT"
        echo "   TLMVIEW_COUNT: $TLMVIEW_COUNT"
        echo "   STATIC_COUNT: $STATIC_COUNT"
        echo "🎉 Build validation finished successfully."

  post_build:
    commands:
      - |
        exec > >(stdbuf -oL tee -a /tmp/build.log) 2>&1
        echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [POST_BUILD] UPLOADING_LOGS"
        S3_PATH="s3://nonprod-release-management-codebuild-logs/pipeline-logs/$PIPELINE_EXECUTION_ID/$STAGE_NAME/build.log"
        aws s3 cp /tmp/build.log "$S3_PATH"
        echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [POST_BUILD] LOGS_UPLOADED_TO=$S3_PATH"

artifacts:
  files:
    - '**/*'