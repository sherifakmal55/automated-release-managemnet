            fi

            echo "✅ Obtained PROJECT_ID='${PROJECT_ID}' for project '${PROJECT_TO_BACKUP}'"

            # 3.b) Run backup-modularexport.sh on control instance (CTRL_IID)
            echo "🧪 Preparing backup-modularexport.sh for CONTROL instance ${CTRL_IID} (project_id=${PROJECT_ID})"

            S3_CONTROL_UPLOAD="${BUCKET_BASE%/}/${JIRA_ID}/Control"
            SAFE_PROJ=$(echo "${PROJECT_TO_BACKUP}" | sed 's/ /_/g')
            echo "🧪 $SAFE_PROJ"

            # -------------------------------------------------------------------------
            # Build commands_control_exec.json using template + placeholder replacement
            # Template writes literal $VARIABLE names (no local expansion) so remote shell evaluates them.
            # Note: __WCPASS__ is placed inside single quotes in the template -> '__WCPASS__'
            # We will escape any single-quotes in the actual password to keep the single-quoted literal valid.
            # -------------------------------------------------------------------------
            cat > commands_control_exec.json <<'JSON_TPL'
        {
          "commands": [
            "set -euo pipefail",
            "mkdir -p /tmp/__JIRA__/control",
            "UTIL_SUB=$(ls -1 /tmp/__JIRA__/utilities/control 2>/dev/null | grep -E '^tool' | head -n1 || true)",
            "if [[ -n \"$UTIL_SUB\" ]]; then UTIL_PATH=\"/tmp/__JIRA__/utilities/control/$UTIL_SUB\"; else UTIL_PATH=\"/tmp/__JIRA__/utilities/control\"; fi",
            "BACKUP_FILE=/tmp/__JIRA__/control/__PROJ____JIRA__.tcm",
            "echo \"Using UTIL_PATH=$UTIL_PATH BACKUP_FILE=$BACKUP_FILE\"",
            "/tmp/__JIRA__/scripts/backup-modularexport.sh \"$UTIL_PATH\" \"$BACKUP_FILE\" \"__WCUSER__\" __WCPASS__ \"__CTRLIP__\" \"__CTRLP__\" \"__PID__\" \"__JAVA_PATH__\"",
            "if [[ -f \"$BACKUP_FILE\" ]]; then /usr/local/bin/aws s3 cp \"$BACKUP_FILE\" \"__S3UP__/\" --region __REG__; echo \"✅ Uploaded control backup to s3\"; else echo \"⚠️ Control backup file not created: $BACKUP_FILE\"; exit 3; fi"
          ]
        }
        JSON_TPL

            # Escape any single-quotes in the password so that the single-quoted literal remains valid on remote shell.
            # Example transform:  don't'panic -> don'"'"'t'panic  (so it becomes safe inside single quotes)
            PASS_ESC=$(printf '%s' "$WC_PASS" | sed "s/'/'\"'\"'/g")

