        else
                echo "✅ Found $CT_TASKS_IN_JSON ConfigurationTransfer task(s) in task.json"
                
                for (( i=0; i<$(jq '.backup | length' task.json); i++ )); do
                        UNFORMATTED_TASK_TYPE=$(jq -r ".backup[$i].task_type" task.json)
                        TASK_TYPE=$(echo "$UNFORMATTED_TASK_TYPE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z]//g')
                        if [[ "$TASK_TYPE" == "configurationtransfer" ]]; then
                                SERVER=$(jq -r ".backup[$i].server // empty" task.json)
                                CTE_FILE=$(jq -r ".backup[$i].created_backup_file" task.json)
                                TEMPLATE_FILE=$(jq -r ".backup[$i].template_file" task.json)
                                TASK_IDENTIFIER="$UNFORMATTED_TASK_TYPE"

                                # Determine DB_URL based on version (special case for RP-3.0)
                                if [[ "$VERSION" == "RP-3.0" || "$VERSION" == "RP-3.1" ]]; then
                                        CT_DB_URL="${DB_URL#jdbc:}"
                                        echo "🔧 Version RP-3.0 / RP-3.1 detected — using modified DB URL (without 'jdbc:'): $CT_DB_URL"
