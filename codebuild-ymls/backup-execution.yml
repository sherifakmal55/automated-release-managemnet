        #################################
        # 6) TLM VIEW BACKUP
        #################################
        echo "📌 Starting TLM View backup process"

        TLM_TASKS_IN_JSON=$(jq '[.backup[] | select(.task_type | test("^TLMView"; "i"))] | length' task.json)

        if [[ "$TLM_TASKS_IN_JSON" -eq 0 ]]; then
            echo "ℹ️ No TLMView entries found in task.json - skipping TLM View backup process"
        else
            echo "✅ Found $TLM_TASKS_IN_JSON TLMView task(s) in task.json"
            
            for (( i=0; i<$(jq '.backup | length' task.json); i++ )); do
                UNFORMATTED_TASK_TYPE=$(jq -r ".backup[$i].task_type" task.json)
                TASK_TYPE=$(echo "$UNFORMATTED_TASK_TYPE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z]//g')
                if [[ "$TASK_TYPE" == "tlmview" ]]; then
                    SERVER=$(jq -r ".backup[$i].server // empty" task.json)
                    BLUEPRINT_FILE=$(jq -r ".backup[$i].blueprint_file" task.json)
                    CREATED_BACKUP_FILE=$(jq -r ".backup[$i].created_backup_file" task.json)
                    TASK_IDENTIFIER="$UNFORMATTED_TASK_TYPE"

                    if [[ -n "$SERVER" ]]; then
                        echo "🔍 Looking up instance ID for server '$SERVER'..."
                        INSTANCE_ID=$(echo "$PARAM_JSON" | jq -r ".Instance_mappings.\"${SERVER}_instance_id\" // empty")
                        if [[ -n "$INSTANCE_ID" ]]; then
                            echo "✅ Using instance ID from server mapping: $INSTANCE_ID"
                        fi
                    fi

                    if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "null" ]]; then
                        echo "⚙️ Server not provided or mapping not found, using task-type mapping for '$TASK_TYPE'"
                        INSTANCE_ID=$(echo "$PARAM_JSON" | jq -r ".task_type_mappings.\"${TASK_TYPE}_instance_id\" // empty")
                    fi

                    if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "null" ]]; then
                        echo "❌ No instance ID found for server '${SERVER:-none}' or task_type '${TASK_TYPE}'. Skipping."
                        FAIL_LIST+="TLMView → ${SERVER:-unknown} (missing instance id)"$'\n'
                        continue
                    fi

                    echo "📌 Running TLM View backup script on EC2 instance: $INSTANCE_ID"

                    TLM_CMD_ID=$(aws ssm send-command \
                        --document-name "AWS-RunShellScript" \
                        --instance-ids "$INSTANCE_ID" \
                        --region "$REGION" \
                        --comment "Executing TLM View backup script" \
                        --parameters "commands=[
                        \"chmod +x /tmp/${JIRA_ID}/scripts/backup-tlmview.sh\",
                        \"/tmp/${JIRA_ID}/scripts/backup-tlmview.sh $JIRA_ID $BLUEPRINT_FILE $CREATED_BACKUP_FILE $BUCKET_BASE $DB_URL $ORACLE_USER $ORACLE_PASS $JAVA_PATH $TASK_IDENTIFIER\"
                        ]" \
                        --query "Command.CommandId" \
                        --output text)

                    echo "📄 TLM View Command ID: $TLM_CMD_ID"

                    # Poll until complete and capture stdout/stderr
                    while true; do
                        TLM_STATUS=$(aws ssm list-command-invocations \
                            --command-id "$TLM_CMD_ID" \
                            --region "$REGION" \
                            --query "CommandInvocations[].Status" \
                            --output text)

                        echo "TLM View command status: $TLM_STATUS"

                        if [[ "$TLM_STATUS" == "Success" || "$TLM_STATUS" == "Failed" || "$TLM_STATUS" == "TimedOut" || "$TLM_STATUS" == "Cancelled" ]]; then
                            echo "📜 Fetching detailed TLM View command output (stdout & stderr)..."
                            aws ssm get-command-invocation \
                                --command-id "$TLM_CMD_ID" \
                                --instance-id "$INSTANCE_ID" \
                                --region "$REGION" \
                                --query '{Status:Status, StandardOutputContent:StandardOutputContent, StandardErrorContent:StandardErrorContent}' \
                                --output json > /tmp/tlm_output_${SERVER}.json

                            echo "🔎 ===== TLM View STDOUT (${SERVER}) ====="
                            jq -r '.StandardOutputContent' /tmp/tlm_output_${SERVER}.json

                            echo "⚠️ ===== TLM View STDERR (${SERVER}) ====="
                            jq -r '.StandardErrorContent' /tmp/tlm_output_${SERVER}.json

                            if [[ "$TLM_STATUS" == "Success" ]]; then
                                echo "✅ TLM View backup success: $SERVER"
                                SUCCESS_LIST+="TLMView → ${SERVER} (${CREATED_BACKUP_FILE})"$'\n'
                                break
                            else
                                echo "❌ TLM View backup failed for $SERVER. Status: $TLM_STATUS"
                                FAIL_LIST+="TLMView → ${SERVER} (${CREATED_BACKUP_FILE})"$'\n'
                                break
                            fi
                        else
                            echo "⏳ TLM View command still running, waiting..."
                            sleep 10
                        fi
                    done
                fi
            done
        fi

        # #################################
