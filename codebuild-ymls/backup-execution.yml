version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - yum install -y coreutils || true
      - |
        exec > >(stdbuf -oL tee -a /tmp/build.log) 2>&1
        echo "📦 Installing tools..."
        yum install -y jq awscli
        echo "✅ Install complete"
        echo PIPELINE_EXECUTION_ID=$PIPELINE_EXECUTION_ID
        echo STAGE_NAME=$STAGE_NAME

  build:
    commands:
      - | 
        exec > >(stdbuf -oL tee -a /tmp/build.log) 2>&1 
        echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [BUILD]  📥 Reading task.json..."
        cp $CODEBUILD_SRC_DIR_ValidatedOutput/task.json task.json
        cat task.json

      
        echo "📁 Storing task.json into Parameter Store under /rm-flow-controller/<JIRA_ID> ..."

        # extract JIRA_ID from task.json
        JIRA_ID=$(jq -r '.jira_ticket // empty' task.json)
        if [[ -z "$JIRA_ID" ]]; then
          echo "❌ jira_ticket not found in task.json; cannot create parameter path"
          exit 1
        fi

        # compact JSON to one line (safe for SSM)
        TASK_JSON_COMPACT=$(jq -c . task.json) || { echo "❌ failed to compact task.json"; exit 1; }

        # determine region: prefer existing $REGION, else env vars, else default
        REGION="${REGION:-${AWS_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}}"

        PARAM_NAME="/rm-flow-controller/${JIRA_ID}/task.json"

        echo "🔐 Putting Parameter Store value at ${PARAM_NAME} (region=${REGION}) ..."
        aws ssm put-parameter \
          --name "$PARAM_NAME" \
          --value "$TASK_JSON_COMPACT" \
          --type String \
          --overwrite \
          --region "$REGION" \
          >/dev/null 2>&1 \
          && echo "✅ task.json stored at Parameter Store: $PARAM_NAME (created/overwritten)" \
          || { echo "❌ Failed to put parameter to SSM ($PARAM_NAME)"; aws ssm put-parameter --name "$PARAM_NAME" --value "$TASK_JSON_COMPACT" --type String --overwrite --region "$REGION" --debug || true; exit 1; }
        echo "🚀 Starting backup execution (collect WAR info before assume-role)..."
      
        set -euo pipefail

        echo "📌 Extracting metadata..."
        CLIENT=$(jq -r '.client' task.json)
        ENV=$(jq -r '.env' task.json)
        JIRA_ID=$(jq -r '.jira_ticket' task.json)
        VERSION=$(jq -r '.version' task.json)
        echo "✅ Fields loaded: CLIENT=${CLIENT} ENV=${ENV} JIRA=${JIRA_ID} VER=${VERSION}"

        echo "📥 Fetching Parameter Store JSON..."
        PARAM_PATH="/arm-cpr/$CLIENT/$ENV/details.json"
        PARAM_JSON=$(aws ssm get-parameter --name "$PARAM_PATH" --with-decryption --query 'Parameter.Value' --output text)
        echo "✅ Parameter JSON fetched"

        REGION=$(echo "$PARAM_JSON" | jq -r '.region')
        ROLE_ARN=$(echo "$PARAM_JSON" | jq -r '.assume_role_arn')
        SQL_INSTANCE_ID=$(echo "$PARAM_JSON" | jq -r '.task_type_mappings.sqlserver_instance_id')
        ORACLE_HOST=$(echo "$PARAM_JSON" | jq -r '.database_details.oracle_host')
        ORACLE_PORT=$(echo "$PARAM_JSON" | jq -r '.database_details.oracle_port')
        ORACLE_SID=$(echo "$PARAM_JSON" | jq -r '.database_details.oracle_sid')
        ORACLE_USER=$(echo "$PARAM_JSON" | jq -r '.database_details.oracle_user')
        JBOSS_PATH=$(echo "$PARAM_JSON" | jq -r '.wildfly_details.jboss_path')
        JAVA_PATH=$(echo "$PARAM_JSON" | jq -r '.wildfly_details.java_path')
        JBOSS_USER=$(echo "$PARAM_JSON" | jq -r '.wildfly_details.jboss_user')
        MGMT_PORT=$(echo "$PARAM_JSON" | jq -r '.wildfly_details.jbosscli_port')
        SECRET_ARN=$(echo "$PARAM_JSON" | jq -r '.database_details.secret_arn')
        ORACLE_PATH=$(echo "$PARAM_JSON" | jq -r '.database_details.oracle_path')

        # JDBC URL for CT backup
        DB_URL="jdbc:oracle:thin:@${ORACLE_HOST}:${ORACLE_PORT}:${ORACLE_SID}"

        # S3 base (already includes bucket + prefix), e.g. s3://stl-<client>-housekeeping/release-management
        BUCKET_BASE=$(echo "$PARAM_JSON" | jq -r '.backup_s3_details.bucket_name')

        if [[ -z "$REGION" || "$REGION" == "null" || -z "$ROLE_ARN" || "$ROLE_ARN" == "null" ]]; then
          echo "❌ region/assume_role_arn missing in Parameter Store"; exit 1
        fi
        echo "✅ REGION=${REGION} and ROLE_ARN present"

        # Assume role to access Secrets Manager
        ASSUME_ROLE_OUTPUT=$(aws sts assume-role \
          --role-arn "$ROLE_ARN" \
          --role-session-name "CodeBuildSession" \
          --region "$REGION")

        export AWS_ACCESS_KEY_ID=$(echo "$ASSUME_ROLE_OUTPUT" | jq -r '.Credentials.AccessKeyId')
        export AWS_SECRET_ACCESS_KEY=$(echo "$ASSUME_ROLE_OUTPUT" | jq -r '.Credentials.SecretAccessKey')
        export AWS_SESSION_TOKEN=$(echo "$ASSUME_ROLE_OUTPUT" | jq -r '.Credentials.SessionToken')

        # Fetch secret from Secrets Manager
        SECRET_JSON=$(aws secretsmanager get-secret-value \
          --secret-id "$SECRET_ARN" \
          --region "$REGION" \
          --query "SecretString" \
          --output text)

        # Extract Oracle password
        ORACLE_PASS=$(echo "$SECRET_JSON" | jq -r '.password')
        echo "✅ Password exported and stored as a ORACLE_PASS variable"

        echo $ORACLE_PASS

        
        # Unset temporary credentials
        unset AWS_ACCESS_KEY_ID
        unset AWS_SECRET_ACCESS_KEY
        unset AWS_SESSION_TOKEN

        #############################################
        # PRE-COLLECT WAR TASKS (2+3 variables model)
        #############################################
        echo "🎭 Collecting WAR deployment details (pre-assume-role)..."

        TASK_JSON_TEXT="$(cat task.json)"
        
        jq -n \
          --argjson t "${TASK_JSON_TEXT}" \
          --argjson p "${PARAM_JSON}" '
            [
              $t.backup[]
              | select(.task_type | test("^WarDeployment"; "i"))
              | {
                  comp: ((.server_name // .server) | ascii_downcase),
                  war_file: (.war_to_backup // ""),
                  iid: ( $p.Instance_mappings[((.server_name // .server | ascii_downcase) + "_instance_id")] // "" )
                }
              | select(.comp != "" and .war_file != "" and .iid != "")
            ]
          ' > war_tasks_exec.json


        echo "📄 WAR tasks (ready):"
        jq . war_tasks_exec.json
        WAR_READY=$(jq 'length' war_tasks_exec.json)
        echo "✅ WAR tasks ready for execution: ${WAR_READY}"

        echo "🔐 Assuming client account role..."
        CREDS=$(aws sts assume-role --role-arn "$ROLE_ARN" --role-session-name Stage4BackupSession)
        export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r '.Credentials.AccessKeyId')
        export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r '.Credentials.SecretAccessKey')
        export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r '.Credentials.SessionToken')
        echo "✅ AssumeRole success"

        echo "🔁 Processing backup tasks..."
        SUCCESS_LIST=""
        FAIL_LIST=""

        #################################
        # 1) DATABASE BACKUPS  
        #################################
        jq -c '.backup[]' task.json | while IFS= read -r TASK_JSON_ROW; do
          TASK_TYPE=$(echo "$TASK_JSON_ROW" | jq -r '.task_type')

          # Handle numbered task types by stripping the number
          BASE_TASK_TYPE=$(echo "$TASK_TYPE" | sed 's/[0-9]*$//')  # Remove trailing numbers

          case "$BASE_TASK_TYPE" in
            "DatabaseProcedure")
              OBJECT_NAMES=$(echo "$TASK_JSON_ROW" | jq -r '.procedure_to_backup[]?')
              DIR_NAME="DatabaseProcedure"
              SCRIPT="backup-sqlprocedure.sh"
              ;;
            "DatabaseFunction")
              OBJECT_NAMES=$(echo "$TASK_JSON_ROW" | jq -r '.functions_to_backup[]?')
              DIR_NAME="DatabaseFunction"
              SCRIPT="backup-sqlfunction.sh"
              ;;
            "DatabaseView")
              OBJECT_NAMES=$(echo "$TASK_JSON_ROW" | jq -r '.views_to_backup[]?')
              
              DIR_NAME="DatabaseView"
              SCRIPT="backup-sqlview.sh"
              ;;
            "DatabaseTable")
              OBJECT_NAMES=$(echo "$TASK_JSON_ROW" | jq -r '.tables_to_backup[]?')
              DIR_NAME="DatabaseTable"
              SCRIPT="backup-sqltable.sh"
              ;;
            *)
              # ignore non-DB backup items in backup[]
              echo "⚠️  Unknown task type: ${TASK_TYPE}, skipping..."
              continue
              ;;
          esac

          # Check if OBJECT_NAMES is empty or null
          if [[ -z "${OBJECT_NAMES:-}" || "$OBJECT_NAMES" == "null" ]]; then
            echo "❌ Skipping: No objects found for ${TASK_TYPE}"
            FAIL_LIST+="${TASK_TYPE} → NO_OBJECTS"$'\n'
            continue
          fi

          if [[ -z "${SQL_INSTANCE_ID:-}" || "$SQL_INSTANCE_ID" == "null" ]]; then
            echo "❌ Skipping: SQL instance id missing in Parameter Store"
            FAIL_LIST+="${TASK_TYPE} → MULTIPLE_OBJECTS (no SQL instance)"$'\n'
            continue
          fi

          SCRIPT_PATH="/tmp/${JIRA_ID}/scripts/${SCRIPT}"
          BACKUP_DIR="/tmp/${JIRA_ID}/backup/${DIR_NAME}"
          S3_UPLOAD_PATH="${BUCKET_BASE%/}/${JIRA_ID}/${DIR_NAME}"

          echo "📁 Creating dir: ${BACKUP_DIR} on ${SQL_INSTANCE_ID}"
          
          # Loop through each object name
          echo "$OBJECT_NAMES" | while IFS= read -r OBJECT_NAME; do
            if [[ -z "${OBJECT_NAME:-}" || "$OBJECT_NAME" == "null" ]]; then
              echo "❌ Skipping: Empty object name in ${TASK_TYPE}"
              FAIL_LIST+="${TASK_TYPE} → EMPTY_OBJECT"$'\n'
              continue
            fi

            echo "🧪 Running DB script: ${SCRIPT} for ${OBJECT_NAME} (Task: ${TASK_TYPE})"

            if [[ "$BASE_TASK_TYPE" == "DatabaseTable" ]]; then
              CMD="bash ${SCRIPT_PATH} ${ORACLE_HOST} ${ORACLE_PORT} ${ORACLE_SID} ${ORACLE_USER} ${ORACLE_PASS} ${OBJECT_NAME} ${JIRA_ID} ${ORACLE_PATH}"
            else
              CMD="bash ${SCRIPT_PATH} ${ORACLE_HOST} ${ORACLE_PORT} ${ORACLE_SID} ${ORACLE_USER} ${ORACLE_PASS} ${OBJECT_NAME} ${BACKUP_DIR} ${JIRA_ID} ${S3_UPLOAD_PATH} ${ORACLE_PATH}"
            fi

            PARAMS_JSON=$(printf '{"commands":["mkdir -p %s","%s"]}' "${BACKUP_DIR}" "${CMD}")

            echo $PARAMS_JSON

            CMD_ID=$(aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --instance-ids "${SQL_INSTANCE_ID}" \
              --parameters "${PARAMS_JSON}" \
              --comment "Backup: ${TASK_TYPE} → ${OBJECT_NAME}" \
              --region "${REGION}" \
              --query "Command.CommandId" --output text)

            if [[ -z "$CMD_ID" || "$CMD_ID" == "None" ]]; then
              echo "❌ Failed to start SSM command for ${TASK_TYPE} → ${OBJECT_NAME}"
              FAIL_LIST+="${TASK_TYPE} → ${OBJECT_NAME}"$'\n'
              continue
            fi

            echo "⏳ Waiting for SSM command (${CMD_ID}) for ${OBJECT_NAME}..."
            if ! aws ssm wait command-executed --command-id "${CMD_ID}" --instance-id "${SQL_INSTANCE_ID}" --region "${REGION}"; then
              echo "❌ SSM waiter reported failure for ${OBJECT_NAME}"
            fi

            OUT=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" \
              --instance-id "${SQL_INSTANCE_ID}" \
              --region "${REGION}" \
              --output json)

            ST=$(echo "$OUT"   | jq -r '.Status')
            SO=$(echo "$OUT"   | jq -r '.StandardOutputContent')
            SE=$(echo "$OUT"   | jq -r '.StandardErrorContent')

            echo "📄 Status for ${OBJECT_NAME}: ${ST}"
            echo "📤 Output for ${OBJECT_NAME}:"
            echo "$SO"

            if [[ "$ST" == "Success" ]]; then
              echo "✅ ${TASK_TYPE} → ${OBJECT_NAME} backup succeeded"
              SUCCESS_LIST+="${TASK_TYPE} → ${OBJECT_NAME}"$'\n'
            else
              echo "❌ ${TASK_TYPE} → ${OBJECT_NAME} backup failed"
              echo "🪵 Error Log for ${OBJECT_NAME}:"
              echo "$SE"
              FAIL_LIST+="${TASK_TYPE} → ${OBJECT_NAME}"$'\n'
            fi
            echo "----------------------------------------"
          done
        done

        #################################
        # 2) WAR BACKUPS (from deploy[])
        #################################
        echo "🛡️ Executing WAR backups..."
        WAR_COUNT=$(jq 'length' war_tasks_exec.json)
        if [[ "$WAR_COUNT" -eq 0 ]]; then
          echo "ℹ️ No executable WAR tasks (either none found or missing mapping/file)"
        fi

        S3_WAR_UPLOAD="${BUCKET_BASE%/}/${JIRA_ID}/WAR"

        while IFS= read -r ROW; do
          COMP=$(echo "$ROW" | jq -r '.comp')
          WAR_FILE=$(echo "$ROW" | jq -r '.war_file')
          WAR_INSTANCE=$(echo "$ROW" | jq -r '.iid')

          WAR_SCRIPT="/tmp/${JIRA_ID}/scripts/backup-war.sh"
          # Added JBOSS_PATH, JAVA_PATH and MGMT_PORT as extra args (no other changes)
          WAR_CMD="bash ${WAR_SCRIPT} \"${WAR_FILE}\" \"${JIRA_ID}\" \"${S3_WAR_UPLOAD}\" \"${JBOSS_PATH}\" \"${JAVA_PATH}\" \"${MGMT_PORT}\" \"${JBOSS_USER}\""

          echo "🧪 WAR backup on ${COMP} (${WAR_INSTANCE}): file=${WAR_FILE}"
          WAR_PAYLOAD=$(jq -n --arg cmd "$WAR_CMD" '{commands: [$cmd]}')

          WAR_CMD_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${WAR_INSTANCE}" \
            --parameters "${WAR_PAYLOAD}" \
            --comment "WAR backup: ${COMP} → ${WAR_FILE}" \
            --region "${REGION}" \
            --query "Command.CommandId" --output text)

          if [[ -z "$WAR_CMD_ID" || "$WAR_CMD_ID" == "None" ]]; then
            echo "❌ Failed to start SSM for WAR backup (${COMP})"
            FAIL_LIST+="WARDeployment → ${COMP} (${WAR_FILE})"$'\n'
            continue
          fi

          echo "⏳ Waiting for SSM command (${WAR_CMD_ID}) on ${WAR_INSTANCE}..."
          if ! aws ssm wait command-executed --command-id "${WAR_CMD_ID}" --instance-id "${WAR_INSTANCE}" --region "${REGION}"; then
            echo "❌ SSM waiter reported failure (WAR ${COMP})"
          fi

          WR=$(aws ssm get-command-invocation \
            --command-id "${WAR_CMD_ID}" \
            --instance-id "${WAR_INSTANCE}" \
            --region "${REGION}" \
            --output json)

          WS=$(echo "$WR" | jq -r '.Status')
          WSO=$(echo "$WR" | jq -r '.StandardOutputContent')
          WSE=$(echo "$WR" | jq -r '.StandardErrorContent')

          echo "📄 WAR Status (${COMP}): ${WS}"
          echo "📤 WAR Output:"
          echo "$WSO"

          if [[ "$WS" == "Success" ]]; then
            echo "✅ WARDeployment → ${COMP} backup succeeded"
            SUCCESS_LIST+="WARDeployment → ${COMP} (${WAR_FILE})"$'\n'
          else
            echo "❌ WARDeployment → ${COMP} backup failed"
            echo "🪵 Error Log:"
            echo "$WSE"
            FAIL_LIST+="WARDeployment → ${COMP} (${WAR_FILE})"$'\n'
          fi
        done < <(jq -c '.[]' war_tasks_exec.json)

        #################################
        # 2.5) LINUX BACKUPS (from backup[])
        #################################
        echo "🐧 Executing LINUX backups..."
        LINUX_TASKS_IN_JSON=$(jq '[.backup[] | select(.task_type | test("^LinuxPackages"; "i"))] | length' task.json)

        if [[ "$LINUX_TASKS_IN_JSON" -eq 0 ]]; then
            echo "ℹ️ No LinuxPackages entries found in task.json - skipping LINUX backup process"
        else
            # Extract only the bucket name from BUCKET_BASE, whether it's "stl-xxx" or "s3://stl-xxx/prefix"
            LINUX_BUCKET=$(printf '%s' "$BUCKET_BASE" | sed -E 's#^s3://##' | cut -d/ -f1)

            for ROW in $(jq -c '.backup[] | select(.task_type | test("^LinuxPackages"; "i"))' task.json); do
                TASK_TYPE=$(echo "$ROW" | jq -r '.task_type')
                L_SERVER=$(echo "$ROW" | jq -r '.server // .server_name')
                L_FILE=$(echo "$ROW"   | jq -r '.file_to_backup')
                L_PATH=$(echo "$ROW"   | jq -r '.file_path')

                if [[ -z "${L_SERVER:-}" || "$L_SERVER" == "null" ]]; then
                    echo "⚠️ Skipping LinuxPackages backup (no server specified)";
                    FAIL_LIST+="${TASK_TYPE} → <no server>"$'\n'
                    continue
                fi

                # Map instance id: prefer Instance_mappings["<server>_instance_id"], fallback to task_type_mappings.linuxpackages_instance_id if present
                L_KEY="$(echo "$L_SERVER" | tr '[:upper:]' '[:lower:]')_instance_id"
                L_IID=$(echo "$PARAM_JSON" | jq -r --arg k "$L_KEY" '.Instance_mappings[$k]')
                if [[ -z "${L_IID:-}" || "$L_IID" == "null" ]]; then
                    L_IID=$(echo "$PARAM_JSON" | jq -r '.task_type_mappings.linuxpackages_instance_id // empty')
                fi

                if [[ -z "${L_IID:-}" || "$L_IID" == "null" ]]; then
                    echo "❌ No instance mapping for Linux server '${L_SERVER}'"
                    FAIL_LIST+="${TASK_TYPE} → ${L_SERVER} (${L_FILE})"$'\n'
                    continue
                fi

                if [[ -z "${L_FILE:-}" || "$L_FILE" == "null" || -z "${L_PATH:-}" || "$L_PATH" == "null" ]]; then
                    echo "❌ Missing file_to_backup or file_path for Linux server '${L_SERVER}'"
                    FAIL_LIST+="${TASK_TYPE} → ${L_SERVER} (missing inputs)"$'\n'
                    continue
                fi

                L_SCRIPT="/tmp/${JIRA_ID}/scripts/backup-linux.sh"
                L_CMD="bash ${L_SCRIPT} \"${JIRA_ID}\" \"${L_FILE}\" \"${L_PATH}\" \"${LINUX_BUCKET}\""

                echo "🧪 LinuxPackages backup on ${L_SERVER} (${L_IID}): file=${L_FILE} path=${L_PATH} (Task: ${TASK_TYPE})"
                L_PAYLOAD=$(jq -n --arg cmd "$L_CMD" '{commands: [$cmd]}')

                L_CMD_ID=$(aws ssm send-command \
                    --document-name "AWS-RunShellScript" \
                    --instance-ids "${L_IID}" \
                    --parameters "${L_PAYLOAD}" \
                    --comment "LinuxPackages backup: ${TASK_TYPE} → ${L_SERVER} → ${L_FILE}" \
                    --region "${REGION}" \
                    --query "Command.CommandId" --output text)

                if [[ -z "$L_CMD_ID" || "$L_CMD_ID" == "None" ]]; then
                    echo "❌ Failed to start SSM for LinuxPackages backup (${TASK_TYPE} → ${L_SERVER})"
                    FAIL_LIST+="${TASK_TYPE} → ${L_SERVER} (${L_FILE})"$'\n'
                    continue
                fi

                echo "⏳ Waiting for SSM command (${L_CMD_ID}) on ${L_IID}..."
                if ! aws ssm wait command-executed --command-id "${L_CMD_ID}" --instance-id "${L_IID}" --region "${REGION}"; then
                    echo "❌ SSM waiter reported failure (LinuxPackages ${TASK_TYPE} → ${L_SERVER})"
                fi

                LR=$(aws ssm get-command-invocation \
                    --command-id "${L_CMD_ID}" \
                    --instance-id "${L_IID}" \
                    --region "${REGION}" \
                    --output json)

                LS=$(echo "$LR" | jq -r '.Status')
                LSO=$(echo "$LR" | jq -r '.StandardOutputContent')
                LSE=$(echo "$LR" | jq -r '.StandardErrorContent')

                echo "📄 LinuxPackages Status (${TASK_TYPE} → ${L_SERVER}): ${LS}"
                echo "📤 LinuxPackages Output:"
                echo "$LSO"

                if [[ "$LS" == "Success" ]]; then
                    echo "✅ ${TASK_TYPE} → ${L_SERVER} backup succeeded"
                    SUCCESS_LIST+="${TASK_TYPE} → ${L_SERVER} (${L_FILE})"$'\n'
                else
                    echo "❌ ${TASK_TYPE} → ${L_SERVER} backup failed"
                    echo "🪵 Error Log:"
                    echo "$LSE"
                    FAIL_LIST+="${TASK_TYPE} → ${L_SERVER} (${L_FILE})"$'\n'
                fi
                echo "----------------------------------------"
            done
        fi

        #################################
        # 3) CONTROL BACKUPS (get-project-id -> modular-export) with debug
        #################################
        echo "🔧 Executing CONTROL backups..."

        # Debug: print raw task.json size and head
        echo "📂 task.json size: $(stat -c%s task.json) bytes"
        echo "📄 task.json preview (first 10 lines):"
        head -n 10 task.json

        CONTROL_TASKS_IN_JSON=$(jq '[.backup[] | select(.task_type | test("^Control"; "i"))] | length' task.json 2>jq_error.log) || {
          echo "❌ jq failed when reading control tasks: $(cat jq_error.log)"
          exit 1
        }
        echo "✅ Found $CONTROL_TASKS_IN_JSON control backup entries"

        if [[ "$CONTROL_TASKS_IN_JSON" -eq 0 ]]; then
          echo "ℹ️ No Control backup entries found in task.json - skipping CONTROL backup process"
        else
          echo "🔧 Executing CONTROL backups (get-project-id -> modular-export)..."

          # Read control_details once with debug output
          WC_USER=$(echo "$PARAM_JSON" | jq -r '.control_details.wc_user')
          WC_PASS=$(echo "$PARAM_JSON" | jq -r '.control_details.wc_password')
          CONTROL_IP=$(echo "$PARAM_JSON" | jq -r '.control_details.control_server_ip')
          CONTROL_PORT=$(echo "$PARAM_JSON" | jq -r '.control_details.control_server_port')
          JAVA_PATH=$(echo "$PARAM_JSON" | jq -r '.wildfly_details.java_path')

          echo "🔍 Read control_details: wc_user=${WC_USER:-null}, wc_password=${WC_PASS:+****}, ip=${CONTROL_IP:-null}, port=${CONTROL_PORT:-null}, java_path=${JAVA_PATH:-null}"

          # Normalize "null" to empty
          [[ "$WC_USER" == "null" ]] && WC_USER=""
          [[ "$WC_PASS" == "null" ]] && WC_PASS=""
          [[ "$CONTROL_IP" == "null" ]] && CONTROL_IP=""
          [[ "$CONTROL_PORT" == "null" ]] && CONTROL_PORT=""

          if [[ -z "$WC_USER" || -z "$WC_PASS" || -z "$CONTROL_IP" || -z "$CONTROL_PORT" ]]; then
            echo "⚠️ One or more control_details keys missing in Parameter Store. CONTROL backups may fail."
          else
            echo "✅ control_details present (wc_user and server details loaded)"
          fi

          # helper to mask password in outputs
          mask() {
            local s="$1"
            if [[ -n "${WC_PASS:-}" ]]; then
              # mask all occurrences of the password
              printf '%s' "$s" | sed "s|${WC_PASS}|****|g"
            else
              printf '%s' "$s"
            fi
          }

          # Debug: print the jq raw output filtered for Control tasks before looping
          echo "📋 jq filtered Control backup tasks (compact):"
          if ! jq -c '.backup[] | select(.task_type | test("^Control"; "i"))' task.json > control_tasks.json 2>jq_loop_error.log; then
            echo "❌ jq failed filtering control backup tasks: $(cat jq_loop_error.log)"
            exit 1
          fi
          cat control_tasks.json

          # Iterate safe
          jq -c '.backup[] | select(.task_type | test("^Control"; "i"))' task.json | while IFS= read -r ROW; do
            echo "🧾 Processing raw control task row: $ROW"

            TASK_TYPE=$(echo "$ROW" | jq -r '.task_type')
            PROJECT_TO_BACKUP=$(echo "$ROW" | jq -r '.project_to_backup')
            SERVER_NAME=$(echo "$ROW" | jq -r '(.server // .server_name)')

            echo "➡️ CONTROL task: ${TASK_TYPE} project_to_backup='${PROJECT_TO_BACKUP}' server='${SERVER_NAME}'"



            if [[ -z "${PROJECT_TO_BACKUP}" ]]; then
              echo "❌ Missing project_to_backup for ${TASK_TYPE} — skipping"
              FAIL_LIST+="CONTROL → ${TASK_TYPE} (missing project_to_backup)"$'\n'
              continue
            fi

            # Map control server instance id
            CTRL_KEY="$(echo "$SERVER_NAME" | tr '[:upper:]' '[:lower:]')_instance_id"
            CTRL_IID=$(echo "$PARAM_JSON" | jq -r --arg k "$CTRL_KEY" '.Instance_mappings[$k]')

            if [[ -z "${CTRL_IID}" || "${CTRL_IID}" == "null" ]]; then
              # fallback: task_type mapping (optional)
              CTRL_IID=$(echo "$PARAM_JSON" | jq -r '.task_type_mappings.control_instance_id')
            fi

            if [[ -z "${CTRL_IID}" || "${CTRL_IID}" == "null" ]]; then
              echo "❌ No instance mapping for CONTROL server '${SERVER_NAME}' (key=${CTRL_KEY})"
              FAIL_LIST+="CONTROL → ${TASK_TYPE} (${PROJECT_TO_BACKUP}) (no instance mapping)"$'\n'
              continue
            fi

            # 3.a) Run backup-get-project-id.sh on SQL instance to fetch project_id
            if [[ -z "${SQL_INSTANCE_ID}" || "${SQL_INSTANCE_ID}" == "null" ]]; then
              echo "❌ SQL instance id not available. Cannot run backup-get-project-id.sh"
              FAIL_LIST+="CONTROL → ${TASK_TYPE} (${PROJECT_TO_BACKUP}) (no SQL instance)"$'\n'
              continue
            fi

            echo "🧾 Running backup-get-project-id.sh on SQL instance ${SQL_INSTANCE_ID} for project '${PROJECT_TO_BACKUP}'"

            CMDS_GET=$(jq -n --arg jira "$JIRA_ID" '{commands: ["set -euo pipefail", "cd /tmp/" + $jira + "/scripts || true"]}')
            CMDS_GET=$(echo "$CMDS_GET" | jq --arg host "$ORACLE_HOST" --arg port "$ORACLE_PORT" --arg sid "$ORACLE_SID" --arg user "$ORACLE_USER" --arg pass "$ORACLE_PASS" --arg proj "'$PROJECT_TO_BACKUP'" --arg script "./backup-get-project-id.sh" --arg oracle_path "$ORACLE_PATH" '.commands += [($script + " " + $host + " " + $port + " " + $sid + " " + $user + " " + $pass + " " + $proj + " " + $oracle_path)]')

            echo "$CMDS_GET" > commands_get_project.json

            GET_CMD_ID=$(aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --instance-ids "${SQL_INSTANCE_ID}" \
              --comment "get-project-id for ${PROJECT_TO_BACKUP}" \
              --parameters file://commands_get_project.json \
              --region "${REGION}" \
              --query 'Command.CommandId' --output text)

            if [[ -z "$GET_CMD_ID" || "$GET_CMD_ID" == "None" ]]; then
              echo "❌ Failed to send get-project-id command to ${SQL_INSTANCE_ID}"
              FAIL_LIST+="CONTROL → ${TASK_TYPE} (${PROJECT_TO_BACKUP}) (get-project-id send failed)"$'\n'
              continue
            fi

            echo "⏳ Waiting for get-project-id command (${GET_CMD_ID})..."
            if ! aws ssm wait command-executed --command-id "${GET_CMD_ID}" --instance-id "${SQL_INSTANCE_ID}" --region "${REGION}"; then
              echo "❌ SSM waiter reported failure for get-project-id"
            fi

            OUT_GET=$(aws ssm get-command-invocation --command-id "${GET_CMD_ID}" --instance-id "${SQL_INSTANCE_ID}" --region "${REGION}" --output json)
            GET_STATUS=$(echo "$OUT_GET" | jq -r '.Status')
            GET_STDOUT=$(echo "$OUT_GET" | jq -r '.StandardOutputContent // ""')
            GET_STDERR=$(echo "$OUT_GET" | jq -r '.StandardErrorContent // ""')

            echo "📄 get-project-id Status: ${GET_STATUS}"
            echo "📤 get-project-id Output:"
            echo "$GET_STDOUT"
            if [[ -n "$GET_STDERR" ]]; then
              echo "🪵 get-project-id Stderr:"
              echo "$GET_STDERR"
            fi

            # extract a UUID from stdout (last occurrence)
            PROJECT_ID=$(echo "$GET_STDOUT" | grep -Eo -i '([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|SYSTEM[[:alnum:]_-]*PROJECT[[:alnum:]_-]*)' | tail -n1 || true)

            PROJECT_ID=${PROJECT_ID//$'\r'/}

            if [[ -z "${PROJECT_ID}" ]]; then
              echo "❌ Could not extract PROJECT_ID from get-project-id output — skipping CONTROL backup"
              FAIL_LIST+="CONTROL → ${TASK_TYPE} (${PROJECT_TO_BACKUP}) (no project_id)"$'\n'
