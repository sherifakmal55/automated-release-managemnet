                -e "s|__REG__|${REGION}|g" \
                commands_control_exec.json > commands_control_exec.json.tmp && mv commands_control_exec.json.tmp commands_control_exec.json

            # -------------------------
            # Debug & validation steps (UNMASKED, no masking)
            # -------------------------
            echo
            echo "🔍 Debug (UNMASKED): driver variables:"
            echo "  JIRA_ID: ${JIRA_ID}"
            echo "  PROJECT_TO_BACKUP: ${PROJECT_TO_BACKUP}"
            echo "  CTRL_IID: ${CTRL_IID}"
