              cat commands_control_exec.json || true
              FAIL_LIST+="CONTROL → ${TASK_TYPE} (${PROJECT_TO_BACKUP}) (invalid JSON template)"$'\n'
              continue
            else
              echo "✅ commands_control_exec.json is valid JSON"
            fi

            echo
            echo "📋 Debug (UNMASKED): commands_control_exec.json content (raw):"
            sed -n '1,200p' commands_control_exec.json || true
            echo

            # Print individual commands (numbered)
            echo "🔢 Debug (UNMASKED): listing commands to be executed on the instance:"
            jq -r '.commands[]' commands_control_exec.json | nl -ba | while IFS= read -r line; do
              printf '%s\n' "$line"
            done
            echo

            # Extract the modular-export command
            MOD_CMD=$(jq -r '.commands[] | select(test("backup-modularexport.sh"))' commands_control_exec.json 2>/dev/null || true)
            if [[ -n "$MOD_CMD" ]]; then
              echo "⚙️ Debug (UNMASKED): final modular-export command that will be sent to instance:"
              printf '%s\n' "$MOD_CMD"
              echo
            else
              echo "⚠️ Debug: modular-export command not found in commands_control_exec.json"
            fi

            # Print aws ssm invocation preview
            echo "📨 Debug: aws ssm send-command invocation (will use file://commands_control_exec.json):"
            echo "aws ssm send-command --document-name AWS-RunShellScript --instance-ids \"${CTRL_IID}\" --comment \"modular-export for ${PROJECT_TO_BACKUP} (project_id=${PROJECT_ID})\" --parameters file://commands_control_exec.json --region \"${REGION}\""
            echo

            # Send SSM command
            echo "📨 Sending SSM command to instance ${CTRL_IID}..."
            CTRL_CMD_ID=$(aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --instance-ids "${CTRL_IID}" \
              --comment "modular-export for ${PROJECT_TO_BACKUP} (project_id=${PROJECT_ID})" \
              --parameters file://commands_control_exec.json \
              --region "${REGION}" \
              --query 'Command.CommandId' --output text) || true

            if [[ -z "$CTRL_CMD_ID" || "$CTRL_CMD_ID" == "None" ]]; then
              echo "❌ Failed to send modular-export command to ${CTRL_IID} (aws ssm send-command returned empty/None)"
              echo "📋 Preview of commands_control_exec.json (raw):"
              cat commands_control_exec.json || true
              FAIL_LIST+="CONTROL → ${TASK_TYPE} (${PROJECT_TO_BACKUP}) (modular-export send failed)"$'\n'
              continue
            fi

            echo "⏳ Waiting for modular-export command (${CTRL_CMD_ID}) on ${CTRL_IID}..."
            if ! aws ssm wait command-executed --command-id "${CTRL_CMD_ID}" --instance-id "${CTRL_IID}" --region "${REGION}"; then
              echo "❌ SSM waiter reported failure for modular-export (CommandId=${CTRL_CMD_ID})"
            fi

            # Safely fetch invocation output (capture raw)
            RAW_OUT_CTRL=$(aws ssm get-command-invocation --command-id "${CTRL_CMD_ID}" --instance-id "${CTRL_IID}" --region "${REGION}" --output json 2>/dev/null || true)

            # If RAW_OUT_CTRL is empty, try to print an error and continue
            if [[ -z "${RAW_OUT_CTRL}" ]]; then
              echo "❌ Failed to fetch command invocation for CommandId=${CTRL_CMD_ID} Instance=${CTRL_IID}"
              FAIL_LIST+="CONTROL → ${TASK_TYPE} (${PROJECT_TO_BACKUP}) (no invocation output)"$'\n'
              continue
            fi

            # Validate that RAW_OUT_CTRL is valid JSON before using jq
            if ! printf '%s' "${RAW_OUT_CTRL}" | jq -e . >/dev/null 2>&1; then
