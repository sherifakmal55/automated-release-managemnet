            CTRL_STDERR=$(printf '%s' "${RAW_OUT_CTRL}" | jq -r '.StandardErrorContent // ""')

            echo "📄 modular-export Status: ${CTRL_STATUS}"
            echo "📤 modular-export Output:"
            printf '%s\n' "${CTRL_STDOUT}"
            if [[ -n "${CTRL_STDERR}" ]]; then
