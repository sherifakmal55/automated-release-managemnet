        #################################
        # 7) STATIC BACKUP
        #################################
        echo "📌 Checking deploy tasks for Static backup"

        # Find first matching static task index
        STATIC_INDEX=$(jq -r \
            '(.deploy | to_entries | map(select(.value.task_type | test("^static"; "i"))) | .[0].key) // "-1"' \
            task.json)

        if [[ "$STATIC_INDEX" -eq -1 ]]; then
            echo "ℹ️ No Static entries found in deploy array - skipping Static backup process"
        else
            echo "✅ Found Static task in deploy array — starting Static backup process"

            RAW_TASK_TYPE=$(jq -r ".deploy[$STATIC_INDEX].task_type" task.json)
            TASK_TYPE=$(echo "$RAW_TASK_TYPE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z]//g')
            SERVER=$(jq -r ".deploy[$STATIC_INDEX].server // empty" task.json)

            # Instance resolution
            if [[ -n "$SERVER" ]]; then
                echo "🔍 Looking up instance ID for server '$SERVER'..."
                INSTANCE_ID=$(echo "$PARAM_JSON" | jq -r ".Instance_mappings.\"${SERVER}_instance_id\" // empty")
                if [[ -n "$INSTANCE_ID" ]]; then
                    echo "✅ Using instance ID from server mapping: $INSTANCE_ID"
                fi
            fi

            if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "null" ]]; then
                echo "⚙️ Server not provided or mapping not found, using task-type mapping for '$TASK_TYPE'"
                INSTANCE_ID=$(echo "$PARAM_JSON" \
                    | jq -r ".task_type_mappings.\"${TASK_TYPE}_instance_id\" // empty")
            fi

            if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "null" ]]; then
                echo "❌ No instance ID found for server '${SERVER:-none}' or task_type '${TASK_TYPE}'. Skipping."
                FAIL_LIST+="Static → ${SERVER:-unknown} (missing instance id)"$'\n'
                return
            fi

            echo "📌 Running Static Oracle backup script on EC2 instance: $INSTANCE_ID"

            STATIC_CMD_ID=$(aws ssm send-command \
                --document-name "AWS-RunShellScript" \
                --instance-ids "$INSTANCE_ID" \
                --region "$REGION" \
                --comment "Executing Static Oracle backup" \
                --parameters "commands=[
                    \"chmod +x /tmp/${JIRA_ID}/scripts/backup-static.sh\",
                    \"/tmp/${JIRA_ID}/scripts/backup-static.sh $ORACLE_HOST $ORACLE_PORT $ORACLE_SID $ORACLE_USER $ORACLE_PASS $ORACLE_PATH $JIRA_ID\"
                ]" \
                --query "Command.CommandId" \
                --output text)

            echo "📄 Static Command ID: $STATIC_CMD_ID"

            # Poll until completion and fetch stdout + stderr
            while true; do
                STATIC_STATUS=$(aws ssm list-command-invocations \
                    --command-id "$STATIC_CMD_ID" \
                    --region "$REGION" \
                    --query "CommandInvocations[].Status" \
                    --output text)

                echo "Static backup command status: $STATIC_STATUS"

                if [[ "$STATIC_STATUS" == "Success" || "$STATIC_STATUS" == "Failed" || "$STATIC_STATUS" == "TimedOut" || "$STATIC_STATUS" == "Cancelled" ]]; then
                    echo "📜 Fetching detailed Static backup output (stdout & stderr)..."

                    aws ssm get-command-invocation \
                        --command-id "$STATIC_CMD_ID" \
                        --instance-id "$INSTANCE_ID" \
                        --region "$REGION" \
                        --query '{Status:Status, StandardOutputContent:StandardOutputContent, StandardErrorContent:StandardErrorContent}' \
                        --output json > /tmp/static_output_${SERVER}.json

                    echo "🔎 ===== Static STDOUT (${SERVER}) ====="
                    jq -r '.StandardOutputContent' /tmp/static_output_${SERVER}.json

                    echo "⚠️ ===== Static STDERR (${SERVER}) ====="
                    jq -r '.StandardErrorContent' /tmp/static_output_${SERVER}.json

                    if [[ "$STATIC_STATUS" == "Success" ]]; then
                        echo "✅ Static Oracle backup success: $SERVER"
                        SUCCESS_LIST+="Static → ${SERVER} (backup successful)"$'\n'
                    else
                        echo "❌ Static Oracle backup failed for $SERVER. Status: $STATIC_STATUS"
                        FAIL_LIST+="Static → ${SERVER} (backup failed)"$'\n'
                    fi

                    break
                else
                    echo "⏳ Static backup command still running, waiting..."
                    sleep 10
                fi
            done
        fi

        #################################
        # 4) SYNTAX-CT BACKUPS
        #################################
        echo "🔧 Executing SYNTAX-CT backups..."

        # Debug: print raw task.json size and head
        echo "📂 task.json size: $(stat -c%s task.json) bytes"
        echo "📄 task.json preview (first 10 lines):"
        head -n 10 task.json

        SYNTAXCT_TASKS_IN_JSON=$(jq '[.backup[] | select(.task_type | test("^Syntax-CT"; "i"))] | length' task.json 2>jq_error.log) || {
          echo "❌ jq failed when reading syntax-ct tasks: $(cat jq_error.log)"
          exit 1
        }
        echo "✅ Found $SYNTAXCT_TASKS_IN_JSON syntax-ct backup entries"

        if [[ "$SYNTAXCT_TASKS_IN_JSON" -eq 0 ]]; then
          echo "ℹ️ No Syntax-CT backup entries found in task.json - skipping SYNTAX-CT backup process"
        else
          echo "🔧 Executing SYNTAX-CT backups..."

          # Read syntax_ct_details from parameter store
          SYNTAX_ENV_ID=$(echo "$PARAM_JSON" | jq -r '.syntax_ct_details.env_id')
          SYNTAX_ENV_NAME=$(echo "$PARAM_JSON" | jq -r '.syntax_ct_details.env_name')
          SYNTAX_OBJ_VERSION=$(echo "$PARAM_JSON" | jq -r '.syntax_ct_details.obj_version')
          SYNTAX_JAVA_PATH=$(echo "$PARAM_JSON" | jq -r '.syntax_ct_details.java_path')

          echo "🔍 Read syntax_ct_details: env_id=${SYNTAX_ENV_ID:-null}, env_name=${SYNTAX_ENV_NAME:-null}, obj_version=${SYNTAX_OBJ_VERSION:-null}, java_path=${SYNTAX_JAVA_PATH:-null}"

          # Normalize "null" to empty
          [[ "$SYNTAX_ENV_ID" == "null" ]] && SYNTAX_ENV_ID=""
          [[ "$SYNTAX_ENV_NAME" == "null" ]] && SYNTAX_ENV_NAME=""
          [[ "$SYNTAX_OBJ_VERSION" == "null" ]] && SYNTAX_OBJ_VERSION=""
          [[ "$SYNTAX_JAVA_PATH" == "null" ]] && SYNTAX_JAVA_PATH=""

          if [[ -z "$SYNTAX_ENV_ID" || -z "$SYNTAX_ENV_NAME" || -z "$SYNTAX_OBJ_VERSION" || -z "$SYNTAX_JAVA_PATH" ]]; then
            echo "⚠️ One or more syntax_ct_details keys missing in Parameter Store. SYNTAX-CT backups may fail."
          else
            echo "✅ syntax_ct_details present (env details and java path loaded)"
          fi

          # Debug: print the jq raw output filtered for Syntax-CT tasks before looping
          echo "📋 jq filtered Syntax-CT backup tasks (compact):"
          if ! jq -c '.backup[] | select(.task_type | test("^Syntax-CT"; "i"))' task.json > syntaxct_tasks.json 2>jq_loop_error.log; then
            echo "❌ jq failed filtering syntax-ct backup tasks: $(cat jq_loop_error.log)"
            exit 1
          fi
          cat syntaxct_tasks.json

          # Iterate through Syntax-CT tasks
          jq -c '.backup[] | select(.task_type | test("^Syntax-CT"; "i"))' task.json | while IFS= read -r ROW; do
            echo "🧾 Processing raw syntax-ct task row: $ROW"

            TASK_TYPE=$(echo "$ROW" | jq -r '.task_type')
            SYNTAX_TO_BACKUP=$(echo "$ROW" | jq -r '.syntax_to_backup')
            SERVER_NAME=$(echo "$ROW" | jq -r '(.server // .server_name)')

            echo "➡️ SYNTAX-CT task: ${TASK_TYPE} syntax_to_backup='${SYNTAX_TO_BACKUP}' server='${SERVER_NAME}'"

            if [[ -z "${SYNTAX_TO_BACKUP}" ]]; then
              echo "❌ Missing syntax_to_backup for ${TASK_TYPE} — skipping"
              FAIL_LIST+="SYNTAX-CT → ${TASK_TYPE} (missing syntax_to_backup)"$'\n'
              continue
            fi

            # Map syntax-ct server instance id
            SYNTAX_KEY="$(echo "$SERVER_NAME" | tr '[:upper:]' '[:lower:]')_instance_id"
            SYNTAX_IID=$(echo "$PARAM_JSON" | jq -r --arg k "$SYNTAX_KEY" '.Instance_mappings[$k]')

            if [[ -z "${SYNTAX_IID}" || "${SYNTAX_IID}" == "null" ]]; then
              # fallback: task_type mapping (optional)
              SYNTAX_IID=$(echo "$PARAM_JSON" | jq -r '.task_type_mappings.syntax_ct_instance_id')
            fi

            if [[ -z "${SYNTAX_IID}" || "${SYNTAX_IID}" == "null" ]]; then
              echo "❌ No instance mapping for SYNTAX-CT server '${SERVER_NAME}' (key=${SYNTAX_KEY})"
              FAIL_LIST+="SYNTAX-CT → ${TASK_TYPE} (${SYNTAX_TO_BACKUP}) (no instance mapping)"$'\n'
              continue
            fi

            # Prepare S3 upload path and safe syntax name
            S3_SYNTAXCT_UPLOAD="${BUCKET_BASE%/}/${JIRA_ID}/Syntax-CT"
            SAFE_SYNTAX=$(echo "${SYNTAX_TO_BACKUP}" | sed 's/ /_/g')
            echo "🧪 Safe syntax name: $SAFE_SYNTAX"

            # Build commands_syntaxct_exec.json using template
            cat > commands_syntaxct_exec.json <<'JSON_TPL'
        {
          "commands": [
            "set -euo pipefail",
            "mkdir -p /tmp/__JIRA__/syntax-ct",
            "UTIL_SUB=$(ls -1 /tmp/__JIRA__/utilities/syntax-ct/installer/ 2>/dev/null | grep -E '^installer' | head -n1 || true)",
            "if [[ -n \"$UTIL_SUB\" ]]; then UTIL_PATH=\"/tmp/__JIRA__/utilities/syntax-ct/installer/$UTIL_SUB\"; else UTIL_PATH=\"/tmp/__JIRA__/utilities/syntax-ct/installer\"; fi",
            "BACKUP_FILE=/tmp/__JIRA__/syntax-ct/__SYNTAX____JIRA__.cte",
            "echo \"Using UTIL_PATH=$UTIL_PATH BACKUP_FILE=$BACKUP_FILE\"",
            "chmod -R 775 \"$UTIL_PATH\"",
            "/tmp/__JIRA__/scripts/backup-syntaxctexport.sh \"$UTIL_PATH\" \"$BACKUP_FILE\" \"__ENV_ID__\" \"__ENV_NAME__\" \"__OBJ_VER__\" \"__SYNTAX_NAME__\" \"__JAVA_PATH__\"",
            "if [[ -f \"$BACKUP_FILE\" ]]; then /usr/local/bin/aws s3 cp \"$BACKUP_FILE\" \"__S3UP__/\" --region __REG__; echo \"✅ Uploaded syntax-ct backup to s3\"; else echo \"⚠️ Syntax-CT backup file not created: $BACKUP_FILE\"; exit 3; fi"
          ]
        }
        JSON_TPL

            # placeholder replacement
            sed -e "s|__JIRA__|${JIRA_ID}|g" \
                -e "s|__SYNTAX__|${SAFE_SYNTAX}|g" \
                -e "s|__ENV_ID__|${SYNTAX_ENV_ID}|g" \
                -e "s|__ENV_NAME__|${SYNTAX_ENV_NAME}|g" \
                -e "s|__OBJ_VER__|${SYNTAX_OBJ_VERSION}|g" \
                -e "s|__SYNTAX_NAME__|${SYNTAX_TO_BACKUP}|g" \
                -e "s|__JAVA_PATH__|${SYNTAX_JAVA_PATH}|g" \
                -e "s|__S3UP__|${S3_SYNTAXCT_UPLOAD}|g" \
                -e "s|__REG__|${REGION}|g" \
                commands_syntaxct_exec.json > commands_syntaxct_exec.json.tmp && mv commands_syntaxct_exec.json.tmp commands_syntaxct_exec.json

            # -------------------------
            # Debug & validation steps
            # -------------------------
            echo
            echo "🔍 Debug: driver variables:"
            echo "  JIRA_ID: ${JIRA_ID}"
            echo "  SYNTAX_TO_BACKUP: ${SYNTAX_TO_BACKUP}"
            echo "  SYNTAX_IID: ${SYNTAX_IID}"
            echo "  SYNTAX_ENV_ID: ${SYNTAX_ENV_ID}"
            echo "  SYNTAX_ENV_NAME: ${SYNTAX_ENV_NAME}"
            echo "  SYNTAX_OBJ_VERSION: ${SYNTAX_OBJ_VERSION}"
            echo "  S3_SYNTAXCT_UPLOAD: ${S3_SYNTAXCT_UPLOAD}"
            echo "  REGION: ${REGION}"
            echo

            echo "🔎 Debug: validate generated commands_syntaxct_exec.json is valid JSON (jq -e)"
            if ! jq -e . commands_syntaxct_exec.json >/dev/null 2>&1; then
              echo "❌ commands_syntaxct_exec.json is NOT valid JSON. Preview:"
              cat commands_syntaxct_exec.json || true
              FAIL_LIST+="SYNTAX-CT → ${TASK_TYPE} (${SYNTAX_TO_BACKUP}) (invalid JSON template)"$'\n'
              continue
            else
              echo "✅ commands_syntaxct_exec.json is valid JSON"
            fi

            echo
            echo "📋 Debug: commands_syntaxct_exec.json content (raw):"
            sed -n '1,200p' commands_syntaxct_exec.json || true
            echo

            # Print individual commands (numbered)
            echo "🔢 Debug: listing commands to be executed on the instance:"
            jq -r '.commands[]' commands_syntaxct_exec.json | nl -ba | while IFS= read -r line; do
              printf '%s\n' "$line"
            done
            echo

            # Extract the syntax-ct export command
            SYNTAX_CMD=$(jq -r '.commands[] | select(test("backup-syntaxctexport.sh"))' commands_syntaxct_exec.json 2>/dev/null || true)
            if [[ -n "$SYNTAX_CMD" ]]; then
              echo "⚙️ Debug: final syntax-ct export command that will be sent to instance:"
              printf '%s\n' "$SYNTAX_CMD"
              echo
            else
              echo "⚠️ Debug: syntax-ct export command not found in commands_syntaxct_exec.json"
            fi

            # Print aws ssm invocation preview
            echo "📨 Debug: aws ssm send-command invocation (will use file://commands_syntaxct_exec.json):"
            echo "aws ssm send-command --document-name AWS-RunShellScript --instance-ids \"${SYNTAX_IID}\" --comment \"syntax-ct export for ${SYNTAX_TO_BACKUP}\" --parameters file://commands_syntaxct_exec.json --region \"${REGION}\""
            echo

            # Send SSM command
            echo "📨 Sending SSM command to instance ${SYNTAX_IID}..."
            SYNTAX_CMD_ID=$(aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --instance-ids "${SYNTAX_IID}" \
              --comment "syntax-ct export for ${SYNTAX_TO_BACKUP}" \
              --parameters file://commands_syntaxct_exec.json \
              --region "${REGION}" \
              --query 'Command.CommandId' --output text) || true

            if [[ -z "$SYNTAX_CMD_ID" || "$SYNTAX_CMD_ID" == "None" ]]; then
              echo "❌ Failed to send syntax-ct export command to ${SYNTAX_IID} (aws ssm send-command returned empty/None)"
              echo "📋 Preview of commands_syntaxct_exec.json (raw):"
              cat commands_syntaxct_exec.json || true
              FAIL_LIST+="SYNTAX-CT → ${TASK_TYPE} (${SYNTAX_TO_BACKUP}) (syntax-ct export send failed)"$'\n'
              continue
            fi

            echo "⏳ Waiting for syntax-ct export command (${SYNTAX_CMD_ID}) on ${SYNTAX_IID}..."
            if ! aws ssm wait command-executed --command-id "${SYNTAX_CMD_ID}" --instance-id "${SYNTAX_IID}" --region "${REGION}"; then
              echo "❌ SSM waiter reported failure for syntax-ct export (CommandId=${SYNTAX_CMD_ID})"
            fi

            # Safely fetch invocation output (capture raw)
            RAW_OUT_SYNTAX=$(aws ssm get-command-invocation --command-id "${SYNTAX_CMD_ID}" --instance-id "${SYNTAX_IID}" --region "${REGION}" --output json 2>/dev/null || true)

            # If RAW_OUT_SYNTAX is empty, try to print an error and continue
            if [[ -z "${RAW_OUT_SYNTAX}" ]]; then
              echo "❌ Failed to fetch command invocation for CommandId=${SYNTAX_CMD_ID} Instance=${SYNTAX_IID}"
              FAIL_LIST+="SYNTAX-CT → ${TASK_TYPE} (${SYNTAX_TO_BACKUP}) (no invocation output)"$'\n'
              continue
            fi

            # Validate that RAW_OUT_SYNTAX is valid JSON before using jq
            if ! printf '%s' "${RAW_OUT_SYNTAX}" | jq -e . >/dev/null 2>&1; then
              echo "⚠️ get-command-invocation returned non-JSON or unexpected shape. Raw output:"
              printf '%s\n' "${RAW_OUT_SYNTAX}"
              # attempt to extract useful fields with grep as fallback
              echo
              echo "---- fallback raw output (grep) ----"
              printf '%s\n' "${RAW_OUT_SYNTAX}" | sed -n '1,200p'
              FAIL_LIST+="SYNTAX-CT → ${TASK_TYPE} (${SYNTAX_TO_BACKUP}) (invocation not JSON)"$'\n'
              continue
            fi

            # Now safely parse JSON fields
            SYNTAX_STATUS=$(printf '%s' "${RAW_OUT_SYNTAX}" | jq -r '.Status // empty')
            SYNTAX_STDOUT=$(printf '%s' "${RAW_OUT_SYNTAX}" | jq -r '.StandardOutputContent // ""')
            SYNTAX_STDERR=$(printf '%s' "${RAW_OUT_SYNTAX}" | jq -r '.StandardErrorContent // ""')

            echo "📄 syntax-ct export Status: ${SYNTAX_STATUS}"
            echo "📤 syntax-ct export Output:"
            printf '%s\n' "${SYNTAX_STDOUT}"
            if [[ -n "${SYNTAX_STDERR}" ]]; then
              echo "🪵 syntax-ct export Stderr:"
              printf '%s\n' "${SYNTAX_STDERR}"
            fi

            if [[ "${SYNTAX_STATUS}" == "Success" ]]; then
              echo "✅ SYNTAX-CT backup for syntax '${SYNTAX_TO_BACKUP}' succeeded"
              SUCCESS_LIST+="SYNTAX-CT → ${TASK_TYPE} (${SYNTAX_TO_BACKUP})"$'\n'
            else
              echo "❌ SYNTAX-CT backup for syntax '${SYNTAX_TO_BACKUP}' failed"
              FAIL_LIST+="SYNTAX-CT → ${TASK_TYPE} (${SYNTAX_TO_BACKUP})"$'\n'
            fi
          done
        fi

        #################################
        # 4) SUMMARY
        #################################
        echo ""
        echo "📊 🔚 Backup Summary:"
        echo "-----------------------"
        echo "✅ Success:"
        echo -e "${SUCCESS_LIST:-<none>}"
        echo "❌ Failed:"
        echo -e "${FAIL_LIST:-<none>}"
        echo "-------------------------"
        echo "✅ Backup execution phase complete"


  post_build:
    commands:
      - |
        echo "Resetting AWS credentials to CodeBuild role..."

        unset AWS_ACCESS_KEY_ID
        unset AWS_SECRET_ACCESS_KEY
        unset AWS_SESSION_TOKEN
                
        exec > >(stdbuf -oL tee -a /tmp/build.log) 2>&1
        echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [POST_BUILD] UPLOADING_LOGS"
        S3_PATH="s3://nonprod-release-management-codebuild-logs/pipeline-logs/$PIPELINE_EXECUTION_ID/$STAGE_NAME/build.log"
        aws s3 cp /tmp/build.log "$S3_PATH"
        echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] [POST_BUILD] LOGS_UPLOADED_TO=$S3_PATH"


artifacts:
  files:
    - '**/*'