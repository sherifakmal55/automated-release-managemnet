            echo "  S3_CONTROL_UPLOAD: ${S3_CONTROL_UPLOAD}"
            echo "  REGION: ${REGION}"
            echo

            echo "🔎 Debug: validate generated commands_control_exec.json is valid JSON (jq -e)"
            if ! jq -e . commands_control_exec.json >/dev/null 2>&1; then
